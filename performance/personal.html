<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Personal Performance — GDB</title>
<link rel="stylesheet" href="../css/shared.css">
<link rel="stylesheet" href="../css/gdb-shared.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}

/* ── Max-width inner wrapper (aligns with .perf-sections) ── */
.perf-inner{max-width:1600px;margin:0 auto;padding:0 24px;width:100%}

/* ── Person selector bar ── */
.perf-selector{background:var(--surface);border-bottom:1px solid var(--border)}
.perf-selector .perf-inner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:10px;padding-bottom:10px}
.perf-selector-label{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
#perf-person-select{height:28px;padding:0 10px;border:1px solid var(--border);border-radius:5px;background:var(--surface2);color:var(--text);font-size:12px;font-weight:600;cursor:pointer;min-width:130px}
.fb-btn{padding:3px 12px;font-size:11px;font-weight:600;border-radius:20px;cursor:pointer;border:1px solid var(--border);background:var(--surface2);color:var(--text2);transition:all .15s;white-space:nowrap}
.fb-btn.active,.fb-btn:hover{background:color-mix(in srgb,var(--accent) 24%,var(--surface2));border-color:var(--accent);color:var(--accent)}

/* ── Profile card ── */
.perf-profile{background:var(--surface);border-bottom:1px solid var(--border)}
.perf-profile .perf-inner{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-top:10px;padding-bottom:10px}
.perf-avatar{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.perf-person-name{font-size:15px;font-weight:700;color:var(--text)}
.perf-person-sub{font-size:11px;color:var(--text3);margin-top:2px}

/* ── Section sub-nav ── */
.perf-section-nav{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:calc(var(--header-h) + var(--nav-h));z-index:20}
.perf-section-nav .perf-inner{display:flex;gap:0;padding-top:0;padding-bottom:0}
.perf-snav-tab{display:flex;align-items:center;gap:6px;padding:9px 16px;font-size:12px;font-weight:600;color:var(--text3);border-bottom:2px solid transparent;cursor:pointer;text-decoration:none;transition:color .15s,border-color .15s;white-space:nowrap}
.perf-snav-tab:hover{color:var(--text2)}
.perf-snav-tab.active{color:var(--text);border-bottom-color:var(--accent)}
.snav-count{font-size:10px;font-weight:600;color:var(--text3);background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:1px 7px;line-height:1.5;transition:color .15s,border-color .15s}
.perf-snav-tab.active .snav-count{color:var(--accent);border-color:var(--accent)}
/* ── Sections wrapper ── */
.perf-sections{padding:20px 24px;max-width:1600px;margin:0 auto;display:flex;flex-direction:column;gap:32px}
.perf-section-group{display:flex;flex-direction:column;gap:12px}
.perf-section-heading{display:flex;align-items:center;gap:8px;padding:9px 14px;background:color-mix(in srgb,var(--accent) 22%,var(--surface));border-bottom:1px solid color-mix(in srgb,var(--accent) 40%,var(--border))}
.perf-section-title{font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.05em;text-transform:uppercase}
.perf-section-sub{font-size:10px;color:var(--text3);margin-left:auto}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden}
/* ── Heatmap table (matches summary page) ── */
.stbl-wrap{overflow-x:auto}
.stbl{width:100%;border-collapse:collapse;font-size:11.5px;min-width:420px}
.stbl .cg-head{font-size:10px;font-weight:700;color:var(--text);text-transform:uppercase;letter-spacing:.05em;padding:5px 8px;text-align:center;border-bottom:1px solid var(--border)}
.stbl .cg-lead{background:rgba(88,166,255,.07);border-right:2px solid var(--border)}
.stbl .cg-sup{background:rgba(34,211,164,.07);border-right:2px solid var(--border)}
[data-theme="light"] .stbl .cg-lead{background:rgba(124,92,30,.06)}
[data-theme="light"] .stbl .cg-sup{background:rgba(26,107,98,.06)}
[data-theme="dark-warm"] .stbl .cg-lead{background:rgba(212,160,64,.07)}
[data-theme="dark-warm"] .stbl .cg-sup{background:rgba(64,184,168,.07)}
.stbl th{padding:5px 8px;font-size:10px;font-weight:600;color:var(--text2);text-align:center;border-bottom:1px solid var(--border);white-space:nowrap}
.stbl th.col-person{text-align:left;width:160px;background:var(--surface);position:sticky;left:0;z-index:1}
.stbl th.sep{border-right:2px solid var(--border)}
.stbl td{padding:6px 8px;border-bottom:1px solid var(--border);text-align:center;vertical-align:middle;font-variant-numeric:tabular-nums}
.stbl tr:last-child td{border-bottom:none}
.stbl tr:hover td{background:var(--surface2)}
.stbl td.col-person{text-align:left;font-weight:600;color:var(--text);font-size:12px;white-space:nowrap;position:sticky;left:0;background:var(--surface);z-index:1;padding-left:10px}
.stbl tr:hover td.col-person{background:var(--surface2)}
.stbl td.sep{border-right:2px solid var(--border)}
.hm{display:inline-block;min-width:28px;height:24px;border-radius:4px;line-height:24px;padding:0 5px;font-size:11px;font-weight:700}
.hm-0{color:var(--text3)}
.col-total{font-weight:700;color:var(--text);background:var(--surface2)!important}
.p-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;flex-shrink:0}
/* ── Overview quarter rate bar (mirrors summary page) ── */
.ovr-rate-bar{display:flex;align-items:center;gap:6px}
.ovr-rate-track{flex:1;height:5px;background:var(--surface2);border-radius:3px;overflow:hidden;border:1px solid var(--border)}
.ovr-rate-fill{height:100%;border-radius:3px}
.ovr-rate-pct{font-size:11px;font-weight:700;min-width:34px;text-align:right}
</style>
</head>

<body class="has-init-subnav">
<div id="gdb-loading" class="gdb-loading-state"><div class="gdb-spinner-wrap"></div>Loading data…</div>

<div id="perf-content" style="display:none">

  <!-- Person + year selector -->
  <div class="perf-selector">
    <div class="perf-inner">
      <span class="perf-selector-label">Person</span>
      <select id="perf-person-select" onchange="window._perf.curPerson=this.value;_perfRender()"></select>
      <span class="perf-selector-label" style="margin-left:10px">Year</span>
      <div id="perf-year-chips" style="display:flex;gap:6px;flex-wrap:wrap"></div>
    </div>
  </div>

  <!-- Profile card -->
  <div class="perf-profile">
    <div class="perf-inner">
      <div class="perf-avatar" id="perf-avatar">?</div>
      <div>
        <div class="perf-person-name" id="perf-name">—</div>
        <div class="perf-person-sub" id="perf-person-sub">Personal Performance Report</div>
      </div>
    </div>
  </div>

  <!-- Section sub-nav -->
  <div class="perf-section-nav" id="perf-section-nav">
    <div class="perf-inner">
      <a class="perf-snav-tab active" data-sec="initiative" href="#sec-initiative">🏗 Initiative <span class="snav-count" id="snav-count-init">—</span></a>
      <a class="perf-snav-tab" data-sec="issue" href="#sec-issue">🐛 Issue <span class="snav-count" id="snav-count-issue">—</span></a>
      <a class="perf-snav-tab" data-sec="support" href="#sec-support">🔧 Support <span class="snav-count" id="snav-count-sup">—</span></a>
    </div>
  </div>

  <!-- Sections -->
  <div class="perf-sections">

    <!-- ── Initiative ── -->
    <div id="sec-initiative" class="perf-section-group">
      <div class="perf-section-heading">
        <span class="perf-section-title">🏗 Initiative</span>
        <span class="perf-section-sub" id="sec-init-sub"></span>
      </div>
      <div id="perf-kpi"></div>
      <div id="perf-overview-quarter" class="panel"></div>
      <div id="perf-completion-heatmap" class="panel"></div>
      <div id="perf-init-list" class="panel"></div>
    </div>

    <!-- ── Issue ── -->
    <div id="sec-issue" class="perf-section-group">
      <div class="perf-section-heading">
        <span class="perf-section-title">🐛 Issue</span>
        <span class="perf-section-sub" id="sec-issue-sub"></span>
      </div>
      <div id="perf-issue-panels"></div>
    </div>

    <!-- ── Support ── -->
    <div id="sec-support" class="perf-section-group">
      <div class="perf-section-heading">
        <span class="perf-section-title">🔧 Support</span>
        <span class="perf-section-sub" id="sec-sup-sub"></span>
      </div>
      <div id="perf-support-panels"></div>
    </div>

  </div>

</div><!-- /perf-content -->

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="../js/initiative/config.js"></script>
<script src="../js/header.js"></script>
<script src="../js/initiative/data.js"></script>
<script src="../js/issue/config.js"></script>
<script src="../js/issue/data.js"></script>
<script src="../js/support/config.js"></script>
<script src="../js/support/data.js"></script>
<script src="../js/shared/gdb-utils.js"></script>
<script src="../js/performance/render.js"></script>

<script>
var _perfLoadCount = 0;
function _perfMarkReady(src) {
  _perf.ready[src] = true;
  _perfCheckReady();
}

window.onDataReady = function(data) {
  _perf.initData = data || [];
  _perfMarkReady('init');
};

window.addEventListener('DOMContentLoaded', function() {
  buildGdbHeader({ showRefresh: false });
  buildGdbPerformanceSubNav();

  var PERF_ALLOWED=['sawitree.jakkrawannit@kingpower.com','chawanop.witthayaphirak@kingpower.com','petchpailin.tocharoen@kingpower.com','somrythi.pipattanasirikul@kingpower.com'];
  gdbAuthGuard(function(user) {
    var _email=(user.email||'').toLowerCase();
    var _isAdmin=PERF_ALLOWED.indexOf(_email)>=0;
    try{sessionStorage.setItem('gdb_perf_debug',JSON.stringify({src:'cb',ts:Date.now(),email:_email,isAdmin:_isAdmin,ppType:typeof PERF_PEOPLE,ppVal:typeof PERF_PEOPLE!=='undefined'?JSON.stringify(PERF_PEOPLE):'undef'}));}catch(e){}
    console.log('[Perf] auth email:', _email, 'isAdmin:', _isAdmin, 'PERF_PEOPLE:', typeof PERF_PEOPLE);
    var _local=_email.split('@')[0];
    var _match=null;
    for(var _i=0;_i<PERF_PEOPLE.length;_i++){
      if(_local.startsWith(PERF_PEOPLE[_i].toLowerCase())){_match=PERF_PEOPLE[_i];break;}
    }
    if(!_isAdmin){
      console.log('[Perf] local:', _local, 'match:', _match);
      try{sessionStorage.setItem('gdb_perf_debug',JSON.stringify({src:_match?'match':'no-match',ts:Date.now(),email:_email,local:_local,match:_match,ppType:typeof PERF_PEOPLE}));}catch(e){}
      if(!_match){window.location.href='/gdb-ppp/';return;}
      var _ps=document.getElementById('perf-person-select');
      if(_ps)_ps.style.display='none';
      var _pl=document.querySelectorAll('.perf-selector-label')[0];
      if(_pl)_pl.style.display='none';
      if(typeof gdbHidePerformanceSummaryTab==='function')gdbHidePerformanceSummaryTab();
    }
    if(_match)_perf.curPerson=_match;
    loadData();

    loadIssueData(
      function(data) { _perf.issueData = data || []; _perfMarkReady('issue'); },
      function(err)  { console.warn('[Perf] Issue:', err); _perf.issueData = []; _perfMarkReady('issue'); }
    );

    loadSupportData(
      function(data) {
        var loaded = data || [];
        /* Guard: don't overwrite non-empty cache with empty (SWR background re-fetch edge case) */
        if (loaded.length > 0 || _perf.supData.length === 0) { _perf.supData = loaded; }
        _perfMarkReady('sup');
      },
      function(err)  { console.warn('[Perf] Support:', err); if (!_perf.supData.length) _perf.supData = []; _perfMarkReady('sup'); }
    );
  });
});
</script>

<script>
/* ── Section sub-nav scroll spy ── */
(function() {
  var sections = ['initiative','issue','support'];
  var tabs = {};
  sections.forEach(function(id) {
    tabs[id] = document.querySelector('[data-sec="'+id+'"]');
  });

  function setActive(id) {
    sections.forEach(function(s) {
      if (tabs[s]) tabs[s].classList.toggle('active', s === id);
    });
  }

  var obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) {
      if (e.isIntersecting) {
        var id = e.target.id.replace('sec-','');
        setActive(id);
      }
    });
  }, { rootMargin: '-40% 0px -55% 0px', threshold: 0 });

  sections.forEach(function(id) {
    var el = document.getElementById('sec-'+id);
    if (el) obs.observe(el);
  });

  /* Smooth scroll on tab click */
  document.querySelectorAll('.perf-snav-tab').forEach(function(tab) {
    tab.addEventListener('click', function(e) {
      e.preventDefault();
      var sec = this.dataset.sec;
      var el = document.getElementById('sec-'+sec);
      if (!el) return;
      var navTop = document.getElementById('perf-section-nav');
      var offset = navTop ? navTop.getBoundingClientRect().bottom : 92;
      var top = el.getBoundingClientRect().top + window.scrollY - offset - 12;
      window.scrollTo({ top: top, behavior: 'smooth' });
    });
  });
})();
</script>
</body>
</html>
