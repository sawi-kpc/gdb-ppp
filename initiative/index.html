<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Initiatives Timeline — GDB</title>
<link rel="stylesheet" href="../css/shared.css">
<link rel="stylesheet" href="../css/gdb-shared.css">
<link rel="stylesheet" href="../css/initiative.css">
</head>
<body class="has-init-subnav">

<div id="gdb-error"></div>
<div id="gdb-loading"><div class="gdb-spinner"></div><div class="gdb-loading-text">Loading…</div></div>

<div id="init-content" class="gdb-page" style="display:none">
<div class="filter-bar" style="margin-top:16px">
    <span class="fb-label">Roadmap year:</span>
    <div id="yf-sum" style="display:flex;gap:6px;flex-wrap:wrap"></div>
    <button class="fb-btn" id="btn-no-year-tl" onclick="toggleNoYearTl(this)">No roadmap year</button>
  </div>
  <div class="metrics-strip" id="sum-metrics"></div>
  <div class="section">
    <div class="sec-title">Initiative timeline</div>
    <div class="tl-sticky-top">
    <div class="tl-ctrl-row">
      <span class="tl-ctrl-label">Lifecycle Status:</span>
      <div style="position:relative" id="stage-dropdown-wrap">
        <button onclick="toggleDropdown('stage-dropdown-panel')"
          style="height:26px;padding:0 10px;border:1px solid var(--border);border-radius:4px;background:var(--surface2);color:var(--text);font-size:11.5px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap">
          <span id="stage-btn-label" data-empty="All Lifecycle Status">All Lifecycle Status</span><span style="font-size:9px;color:var(--text3)">▾</span>
        </button>
        <div id="stage-dropdown-panel" style="display:none;position:absolute;top:30px;left:0;z-index:200;background:var(--surface);border:1px solid var(--border);border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,0.18);padding:8px 0;min-width:170px">
          <div id="stage-checkbox-list"></div>
          <div style="border-top:1px solid var(--border);margin-top:6px;padding:6px 12px 2px">
            <button onclick="clearSumStageFilter()" style="font-size:10px;color:var(--text3);background:none;border:none;cursor:pointer;padding:0">Clear all</button>
          </div>
        </div>
      </div>
      <div class="fb-sep"></div>
      <span class="tl-ctrl-label">Roadmap Status:</span>
      <div style="position:relative" id="rs-tl-dropdown-wrap">
        <button onclick="toggleDropdown('rs-tl-dropdown-panel')"
          style="height:26px;padding:0 10px;border:1px solid var(--border);border-radius:4px;background:var(--surface2);color:var(--text);font-size:11.5px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap">
          <span id="rs-tl-btn-label" data-empty="All Roadmap Status">All Roadmap Status</span><span style="font-size:9px;color:var(--text3)">▾</span>
        </button>
        <div id="rs-tl-dropdown-panel" style="display:none;position:absolute;top:30px;left:0;z-index:200;background:var(--surface);border:1px solid var(--border);border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,0.18);padding:8px 0;min-width:170px">
          <div id="rs-tl-checkbox-list"></div>
          <div style="border-top:1px solid var(--border);margin-top:6px;padding:6px 12px 2px">
            <button onclick="clearSumRoadmapFilter()" style="font-size:10px;color:var(--text3);background:none;border:none;cursor:pointer;padding:0">Clear all</button>
          </div>
        </div>
      </div>
      <div class="fb-sep"></div>
      <span class="fb-label">Component:</span>
      <div style="position:relative" id="comp-dropdown-wrap">
        <button onclick="toggleDropdown('comp-dropdown-panel')"
          style="height:26px;padding:0 10px;border:1px solid var(--border);border-radius:4px;background:var(--surface2);color:var(--text);font-size:11.5px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap">
          <span id="comp-btn-label" data-empty="All Components">All Components</span><span style="font-size:9px;color:var(--text3)">▾</span>
        </button>
        <div id="comp-dropdown-panel" style="display:none;position:absolute;top:30px;left:0;z-index:200;background:var(--surface);border:1px solid var(--border);border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,0.18);padding:8px 0;min-width:170px">
          <div id="comp-checkbox-list"></div>
          <div style="border-top:1px solid var(--border);margin-top:6px;padding:6px 12px 2px">
            <button onclick="clearSumCompFilter()" style="font-size:10px;color:var(--text3);background:none;border:none;cursor:pointer;padding:0">Clear all</button>
          </div>
        </div>
      </div>
      <div class="fb-sep"></div>
      <span class="fb-label">Dependency System:</span>
      <div style="position:relative" id="dep-dropdown-wrap">
        <button onclick="toggleDropdown('dep-dropdown-panel')"
          style="height:26px;padding:0 10px;border:1px solid var(--border);border-radius:4px;background:var(--surface2);color:var(--text);font-size:11.5px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap">
          <span id="dep-btn-label" data-empty="All Systems">All Systems</span><span style="font-size:9px;color:var(--text3)">▾</span>
        </button>
        <div id="dep-dropdown-panel" style="display:none;position:absolute;top:30px;left:0;z-index:200;background:var(--surface);border:1px solid var(--border);border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,0.18);padding:8px 0;min-width:160px">
          <div id="dep-checkbox-list"></div>
          <div style="border-top:1px solid var(--border);margin-top:6px;padding:6px 12px 2px">
            <button onclick="clearSumDepFilter()" style="font-size:10px;color:var(--text3);background:none;border:none;cursor:pointer;padding:0">Clear all</button>
          </div>
        </div>
      </div>
      <div class="fb-sep"></div>
      <span class="fb-label">PM Role:</span>
      <div style="position:relative" id="sum-pm-dropdown-wrap">
        <button onclick="toggleDropdown('sum-pm-dropdown-panel')"
          style="height:26px;padding:0 10px;border:1px solid var(--border);border-radius:4px;background:var(--surface2);color:var(--text);font-size:11.5px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap">
          <span id="sum-pm-btn-label" data-empty="All PM Roles">All PM Roles</span><span style="font-size:9px;color:var(--text3)">▾</span>
        </button>
        <div id="sum-pm-dropdown-panel" style="display:none;position:absolute;top:30px;left:0;z-index:200;background:var(--surface);border:1px solid var(--border);border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,0.18);padding:8px 0;min-width:170px">
          <div id="sum-pm-checkbox-list"></div>
          <div style="border-top:1px solid var(--border);margin-top:6px;padding:6px 12px 2px">
            <button onclick="clearSumPMFilter()" style="font-size:10px;color:var(--text3);background:none;border:none;cursor:pointer;padding:0">Clear all</button>
          </div>
        </div>
      </div>
      <div style="flex:1"></div>
      <span class="tl-ctrl-label">Search:</span>
      <input type="search" id="sum-search" placeholder="Search summary…"
        oninput="onSumSearchChange(this.value)"
        style="height:26px;padding:0 8px;border:1px solid var(--border);border-radius:4px;background:var(--surface2);color:var(--text);font-size:11.5px;width:180px;outline:none">
    </div>
    <div class="tl-head-wrap" id="tl-head-wrap"><div class="tl-inner" id="tl-head-inner"></div></div>
    </div><!-- /tl-sticky-top -->
    <div class="tl-container" id="tl-container"><div class="tl-inner" id="tl-inner"></div></div>
  </div>
</div>

<!-- TAB 1 INITIATIVES -->
</div>

<!-- Placeholder for data.js timestamp display -->
<span id="refresh-time" style="display:none"></span>
<span id="current-dt" style="display:none"></span>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="../js/initiative/config.js"></script>
<script src="../js/keycloak-config.js"></script>
<script src="../js/header.js"></script>
<script src="../js/shared/gdb-utils.js"></script>
<script src="../js/initiative/render.js"></script>
<script src="../js/initiative/data.js"></script>
<script>
/* Set callback BEFORE loadData() runs */
window.onDataReady = function(data) {
  document.getElementById('gdb-loading').style.display = 'none';
  document.getElementById('init-content').style.display = 'block';
  renderSummary();
  
  /* Update header time from data.js refresh-time span */
  var rtEl = document.getElementById('refresh-time');
  if (rtEl && typeof setGdbUpdateTime === 'function') {
    setGdbUpdateTime(new Date().toISOString());
  }
};

window.addEventListener('DOMContentLoaded', function() {
  buildGdbHeader({ showRefresh: true });
  buildGdbInitiativeSubNav();
  gdbAuthGuard(function(user) {
    /* loadData() is async and calls renderAll() + window.onDataReady() when done */
    loadData();
  });
  /* Wire refresh button to reload data */
  document.addEventListener('click', function(e) {
    if (e.target && e.target.id === 'gdb-refresh-btn') {
      document.getElementById('gdb-loading').style.display = 'flex';
      document.getElementById('init-content').style.display = 'none';
      loadData();
    }
  });
});
</script>
<script>
function toggleDropdown(panelId) {
  var panel = document.getElementById(panelId);
  if (!panel) return;
  panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
}
document.addEventListener('click', function(e) {
  ['stage-dropdown-wrap','rs-tl-dropdown-wrap','comp-dropdown-wrap','dep-dropdown-wrap','sum-pm-dropdown-wrap'].forEach(function(id) {
    var wrap = document.getElementById(id);
    if (wrap && !wrap.contains(e.target)) {
      var panel = wrap.querySelector('[id$="-dropdown-panel"]');
      if (panel) panel.style.display = 'none';
    }
  });
});
</script>
</body>
</html>
