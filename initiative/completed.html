<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Initiatives Completed — GDB</title>
<link rel="stylesheet" href="../css/shared.css">
<link rel="stylesheet" href="../css/gdb-shared.css">
<link rel="stylesheet" href="../css/initiative.css">
</head>
<body class="has-init-subnav">

<div id="gdb-error"></div>
<div id="gdb-loading"><div class="gdb-spinner"></div><div class="gdb-loading-text">Loading…</div></div>

<div id="init-content" class="gdb-page" style="display:none">
<div class="filter-bar" style="margin-top:16px">
    <span class="fb-label">Roadmap year:</span>
    <div id="yf-done" style="display:flex;gap:6px;flex-wrap:wrap"></div>
    <div class="fb-sep"></div>
    <span class="fb-label">BU Owner:</span>
    <div style="position:relative" id="done-bu-wrap">
      <button onclick="toggleDropdown('done-bu-panel')"
        style="height:26px;padding:0 10px;border:1px solid var(--border);border-radius:4px;background:var(--surface2);color:var(--text);font-size:11.5px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap">
        <span id="done-bu-label" data-empty="All BU Owners">All BU Owners</span>
        <span style="font-size:9px;color:var(--text3)">▾</span>
      </button>
      <div id="done-bu-panel" style="display:none;position:absolute;top:30px;left:0;z-index:200;background:var(--surface);border:1px solid var(--border);border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,0.18);padding:8px 0;min-width:180px">
        <div id="done-bu-list"></div>
        <div style="border-top:1px solid var(--border);margin-top:6px;padding:6px 12px 2px">
          <button onclick="clearDoneBUFilter()" style="font-size:10px;color:var(--text3);background:none;border:none;cursor:pointer;padding:0">Clear all</button>
        </div>
      </div>
    </div>
    <div class="fb-sep"></div>
    <span class="fb-label">Component:</span>
    <div style="position:relative" id="done-comp-wrap">
      <button onclick="toggleDropdown('done-comp-panel')"
        style="height:26px;padding:0 10px;border:1px solid var(--border);border-radius:4px;background:var(--surface2);color:var(--text);font-size:11.5px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap">
        <span id="done-comp-label" data-empty="All Components">All Components</span>
        <span style="font-size:9px;color:var(--text3)">▾</span>
      </button>
      <div id="done-comp-panel" style="display:none;position:absolute;top:30px;left:0;z-index:200;background:var(--surface);border:1px solid var(--border);border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,0.18);padding:8px 0;min-width:180px">
        <div id="done-comp-list"></div>
        <div style="border-top:1px solid var(--border);margin-top:6px;padding:6px 12px 2px">
          <button onclick="clearDoneCompFilter()" style="font-size:10px;color:var(--text3);background:none;border:none;cursor:pointer;padding:0">Clear all</button>
        </div>
      </div>
    </div>
    <div style="flex:1"></div>
    <span class="fb-label">Search:</span>
    <input type="search" id="done-search" placeholder="Search summary…"
      oninput="onDoneSearchChange(this.value)"
      style="height:26px;padding:0 8px;border:1px solid var(--border);border-radius:4px;background:var(--surface2);color:var(--text);font-size:11.5px;width:180px;outline:none">
  </div>
  <div style="font-size:11px;color:#aaa;margin-bottom:10px" id="done-count"></div>
  <div id="done-list-wrap"></div>
</div>

<!-- Placeholder for data.js timestamp display -->
<span id="refresh-time" style="display:none"></span>
<span id="current-dt" style="display:none"></span>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="../js/initiative/config.js"></script>
<script src="../js/header.js"></script>
<script src="../js/shared/gdb-utils.js"></script>
<script src="../js/initiative/render.js"></script>
<script src="../js/initiative/data.js"></script>
<script>
/* Set callback BEFORE loadData() runs */
window.onDataReady = function(data) {
  document.getElementById('gdb-loading').style.display = 'none';
  document.getElementById('init-content').style.display = 'block';
  renderCompleted();
  
  /* Update header time from data.js refresh-time span */
  var rtEl = document.getElementById('refresh-time');
  if (rtEl && typeof setGdbUpdateTime === 'function') {
    setGdbUpdateTime(new Date().toISOString());
  }
};

window.addEventListener('DOMContentLoaded', function() {
  buildGdbHeader({ showRefresh: true });
  buildGdbInitiativeSubNav();
  gdbAuthGuard(function(user) {
    /* loadData() is async and calls renderAll() + window.onDataReady() when done */
    loadData();
  });
  /* Wire refresh button to reload data */
  document.addEventListener('click', function(e) {
    if (e.target && e.target.id === 'gdb-refresh-btn') {
      document.getElementById('gdb-loading').style.display = 'flex';
      document.getElementById('init-content').style.display = 'none';
      loadData();
    }
  });
});
</script>
<script>
function toggleDropdown(panelId) {
  var panel = document.getElementById(panelId);
  if (!panel) return;
  panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
}
document.addEventListener('click', function(e) {
  ['done-bu-wrap','done-comp-wrap'].forEach(function(id) {
    var wrap = document.getElementById(id);
    if (wrap && !wrap.contains(e.target)) {
      var panel = wrap.querySelector('[id$="-panel"]');
      if (panel) panel.style.display = 'none';
    }
  });
});
</script>
</body>
</html>
