<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Initiatives List — GDB</title>
<link rel="stylesheet" href="../css/shared.css">
<link rel="stylesheet" href="../css/gdb-shared.css">
<link rel="stylesheet" href="../css/initiative.css">
</head>
<body class="has-init-subnav">

<div id="gdb-error"></div>
<div id="gdb-loading" class="gdb-loading-state"><div class="gdb-spinner-wrap"></div>Loading…</div>

<div id="init-content" class="gdb-page" style="display:none">
<!-- Initiatives List Tab -->
  <!-- Row 1: Roadmap year + Search -->
  <div class="filter-bar" style="margin-top:16px">
    <span class="fb-label">Roadmap year:</span>
    <div id="yf-list" style="display:flex;gap:6px;flex-wrap:wrap"></div>
    <button class="fb-btn" id="btn-no-year-list" onclick="toggleNoYearList(this)">No roadmap year</button>
    <div style="flex:1"></div>
    <button id="btn-list-hide-wontdo" onclick="toggleListHideWontDo()" style="display:inline-flex;align-items:center;gap:6px;background:none;border:none;cursor:pointer;padding:0;flex-shrink:0">
      <span class="list-tog-track"><span class="list-tog-thumb"></span></span>
      <span class="list-tog-label">Hide Won't do</span>
    </button>
    <input type="search" id="list-search" placeholder="Search summary…"
      oninput="onListSearchChange(this.value)"
      style="height:26px;padding:0 8px;border:1px solid var(--border);border-radius:4px;background:var(--surface2);color:var(--text);font-size:11.5px;width:200px;outline:none">
    <button onclick="resetListFilters()" style="height:26px;padding:0 10px;border:1px solid var(--border);border-radius:4px;background:none;color:var(--text3);font-size:11px;cursor:pointer;white-space:nowrap" title="Reset all filters to default">↺ Reset Filter</button>
    <button onclick="saveListFilterPreset()" style="height:26px;padding:0 10px;border:1px solid var(--accent);border-radius:4px;background:none;color:var(--accent);font-size:11px;cursor:pointer;white-space:nowrap" title="Save current filters as preset">＋ Save Filter</button>
  </div>
  <!-- Row 2: All dropdowns -->
  <div class="filter-bar" style="margin-top:8px">
    <div style="position:relative" id="list-status-dropdown-wrap">
      <button onclick="toggleDropdown('list-status-dropdown-panel')"
        style="height:26px;padding:0 10px;border:1px solid var(--border);border-radius:4px;background:var(--surface2);color:var(--text);font-size:11.5px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap">
        <span id="list-status-btn-label" data-empty="All Lifecycle Status">All Lifecycle Status</span><span style="font-size:9px;color:var(--text3)">▾</span>
      </button>
      <div id="list-status-dropdown-panel" style="display:none;position:absolute;top:30px;left:0;z-index:200;background:var(--surface);border:1px solid var(--border);border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,0.18);padding:8px 0;min-width:180px">
        <div id="list-status-checkbox-list"></div>
        <div style="border-top:1px solid var(--border);margin-top:6px;padding:6px 12px 2px">
          <button onclick="clearListStatusFilter()" style="font-size:10px;color:var(--text3);background:none;border:none;cursor:pointer;padding:0">Clear all</button>
        </div>
      </div>
    </div>
    <div style="position:relative" id="rs-dropdown-wrap">
      <button id="rs-dropdown-btn" onclick="toggleRsDropdown()"
        style="height:26px;padding:0 10px;border:1px solid var(--border);border-radius:4px;background:var(--surface2);color:var(--text);font-size:11.5px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap">
        <span id="rs-btn-label" data-empty="All Roadmap Status">All Roadmap Status</span>
        <span style="font-size:9px;color:var(--text3)">▾</span>
      </button>
      <div id="rs-dropdown-panel"
        style="display:none;position:absolute;top:30px;left:0;z-index:200;background:var(--surface);border:1px solid var(--border);border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,0.18);padding:8px 0;min-width:180px">
        <div id="rs-checkbox-list"></div>
        <div style="border-top:1px solid var(--border);margin-top:6px;padding:6px 12px 2px">
          <button onclick="clearRsFilter()" style="font-size:10px;color:var(--text3);background:none;border:none;cursor:pointer;padding:0">Clear all</button>
        </div>
      </div>
    </div>
    <div style="position:relative" id="comp-list-dropdown-wrap">
      <button onclick="toggleDropdown('comp-list-dropdown-panel')"
        style="height:26px;padding:0 10px;border:1px solid var(--border);border-radius:4px;background:var(--surface2);color:var(--text);font-size:11.5px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap">
        <span id="comp-list-btn-label" data-empty="All Components">All Components</span><span style="font-size:9px;color:var(--text3)">▾</span>
      </button>
      <div id="comp-list-dropdown-panel" style="display:none;position:absolute;top:30px;left:0;z-index:200;background:var(--surface);border:1px solid var(--border);border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,0.18);padding:8px 0;min-width:180px">
        <div id="comp-list-checkbox-list"></div>
      </div>
    </div>
    <div style="position:relative" id="dep-list-dropdown-wrap">
      <button onclick="toggleDropdown('dep-list-dropdown-panel')"
        style="height:26px;padding:0 10px;border:1px solid var(--border);border-radius:4px;background:var(--surface2);color:var(--text);font-size:11.5px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap">
        <span id="dep-list-btn-label" data-empty="All Systems">All Systems</span><span style="font-size:9px;color:var(--text3)">▾</span>
      </button>
      <div id="dep-list-dropdown-panel" style="display:none;position:absolute;top:30px;left:0;z-index:200;background:var(--surface);border:1px solid var(--border);border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,0.18);padding:8px 0;min-width:160px">
        <div id="dep-list-checkbox-list"></div>
        <div style="border-top:1px solid var(--border);margin-top:6px;padding:6px 12px 2px">
          <button onclick="clearListDepFilter()" style="font-size:10px;color:var(--text3);background:none;border:none;cursor:pointer;padding:0">Clear all</button>
        </div>
      </div>
    </div>
    <div style="position:relative" id="list-pm-dropdown-wrap">
      <button onclick="toggleDropdown('list-pm-dropdown-panel')"
        style="height:26px;padding:0 10px;border:1px solid var(--border);border-radius:4px;background:var(--surface2);color:var(--text);font-size:11.5px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap">
        <span id="list-pm-btn-label" data-empty="All PM Roles">All PM Roles</span><span style="font-size:9px;color:var(--text3)">▾</span>
      </button>
      <div id="list-pm-dropdown-panel" style="display:none;position:absolute;top:30px;left:0;z-index:200;background:var(--surface);border:1px solid var(--border);border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,0.18);padding:8px 0;min-width:170px">
        <div id="list-pm-checkbox-list"></div>
        <div style="border-top:1px solid var(--border);margin-top:6px;padding:6px 12px 2px">
          <button onclick="clearListPMFilter()" style="font-size:10px;color:var(--text3);background:none;border:none;cursor:pointer;padding:0">Clear all</button>
        </div>
      </div>
    </div>
    <div style="position:relative" id="ini-assignee-dropdown-wrap">
      <button onclick="toggleDropdown('ini-assignee-dropdown-panel')" style="height:26px;padding:0 10px;border:1px solid var(--border);border-radius:4px;background:var(--surface2);color:var(--text);font-size:11.5px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap">
        <span id="ini-assignee-btn-label" data-empty="All Assignees">All Assignees</span>
        <span style="font-size:9px;color:var(--text3)">▾</span>
      </button>
      <div id="ini-assignee-dropdown-panel" style="display:none;position:absolute;top:30px;left:0;z-index:200;background:var(--surface);border:1px solid var(--border);border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,0.18);padding:8px 0;min-width:200px;white-space:nowrap">
        <div id="ini-assignee-checkbox-list"></div>
      </div>
    </div>
    <!-- Role mode toggle -->
    <div style="display:flex;border:1px solid var(--border);border-radius:4px;overflow:hidden;height:26px;flex-shrink:0" title="Filter by role">
      <button id="list-role-lead"    onclick="setListRoleMode('lead')"    style="padding:0 8px;font-size:11px;font-weight:500;border:none;border-right:1px solid var(--border);background:var(--surface2);color:var(--text2);cursor:pointer;white-space:nowrap;transition:background .15s">Lead</button>
      <button id="list-role-any"     onclick="setListRoleMode('any')"     style="padding:0 8px;font-size:11px;font-weight:700;border:none;border-right:1px solid var(--border);background:var(--accent);color:#fff;cursor:pointer;white-space:nowrap;transition:background .15s">Any</button>
      <button id="list-role-support" onclick="setListRoleMode('support')" style="padding:0 8px;font-size:11px;font-weight:500;border:none;background:var(--surface2);color:var(--text2);cursor:pointer;white-space:nowrap;transition:background .15s">Support</button>
    </div>
  </div>
  <div id="list-preset-bar" style="display:none;align-items:center;gap:6px;flex-wrap:wrap;padding:4px 0"></div>
  <div class="pg-bar" id="list-pg-top"></div>
  <table class="dt" id="list-table" style="font-size:11.5px">
    <thead id="list-thead">
      <tr>
        <th data-col="Key"      style="width:72px;white-space:nowrap;cursor:pointer;user-select:none" onclick="listSortBy('Key')">Key</th>
        <th data-col="Summary"  style="cursor:pointer;user-select:none" onclick="listSortBy('Summary')">Summary</th>
        <th data-col="Status"   style="width:90px;cursor:pointer;user-select:none" onclick="listSortBy('Status')">Status</th>
        <th data-col="Roadmap"  style="width:90px;cursor:pointer;user-select:none" onclick="listSortBy('Roadmap')">Roadmap</th>
        <th data-col="Goal"     style="width:110px;cursor:pointer;user-select:none" onclick="listSortBy('Goal')">Project goal</th>
        <th data-col="Type"     style="width:70px;cursor:pointer;user-select:none" onclick="listSortBy('Type')">Type</th>
        <th data-col="Assignee" style="width:110px;cursor:pointer;user-select:none" onclick="listSortBy('Assignee')">Lead Assignee</th>
        <th data-col="Assignee2" style="width:110px;cursor:pointer;user-select:none" onclick="listSortBy('Assignee2')">Support Assignee</th>
        <th data-col="Monitor"  style="width:100px;cursor:pointer;user-select:none" onclick="listSortBy('Monitor')">Monitor</th>
        <th data-col="Start"    style="width:110px;cursor:pointer;user-select:none" onclick="listSortBy('Start')">Target start</th>
        <th data-col="End"      style="width:110px;cursor:pointer;user-select:none" onclick="listSortBy('End')">Target end</th>
        <th style="width:36px;text-align:center">Doc</th>
      </tr>
    </thead>
    <tbody id="list-body"></tbody>
  </table>
  <div class="pg-bar" id="list-pg-bot"></div>
</div>

<!-- Placeholder for data.js timestamp display -->
<span id="refresh-time" style="display:none"></span>
<span id="current-dt" style="display:none"></span>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="../js/initiative/config.js"></script>
<script src="../js/initiative/component-groups.js"></script>
<script src="../js/roles.js"></script>
<script src="../js/header.js"></script>
<script src="../js/shared/gdb-utils.js"></script>
<script src="../js/initiative/render.js"></script>
<script src="../js/initiative/data.js"></script>
<script>
/* Set callback BEFORE loadData() runs */
window.onDataReady = function(data) {
  document.getElementById('gdb-loading').style.display = 'none';
  document.getElementById('init-content').style.display = 'block';
  renderList();
  /* Update header time from data.js refresh-time span */
  var rtEl = document.getElementById('refresh-time');
  if (rtEl && typeof setGdbUpdateTime === 'function') {
    setGdbUpdateTime(new Date().toISOString());
  }
};

window.addEventListener('DOMContentLoaded', function() {
  buildGdbHeader({ showRefresh: true });
  buildGdbInitiativeSubNav();
  gdbAuthGuard(function(user) {
    /* loadData() is async and calls renderAll() + window.onDataReady() when done */
    loadData();
  });
  /* Wire refresh button to reload data */
  document.addEventListener('click', function(e) {
    if (e.target && e.target.id === 'gdb-refresh-btn') {
      document.getElementById('gdb-loading').style.display = 'flex';
      document.getElementById('init-content').style.display = 'none';
      loadData();
    }
  });
});
</script>
<script>
function toggleDropdown(panelId) {
  var panel = document.getElementById(panelId);
  if (!panel) return;
  var isOpen = panel.style.display !== 'none';
  /* close all other dropdowns first */
  document.querySelectorAll('[id$="-dropdown-panel"]').forEach(function(p) { p.style.display = 'none'; });
  panel.style.display = isOpen ? 'none' : 'block';
}
function toggleRsDropdown() {
  toggleDropdown('rs-dropdown-panel');
}
function clearRsFilter() {
  listRoadmapFilter = [];
  document.getElementById('rs-dropdown-panel').style.display = 'none';
  renderList();
}
/* Close dropdowns when clicking outside */
document.addEventListener('click', function(e) {
  ['rs-dropdown-wrap', 'comp-list-dropdown-wrap', 'dep-list-dropdown-wrap', 'list-status-dropdown-wrap', 'list-pm-dropdown-wrap', 'ini-assignee-dropdown-wrap'].forEach(function(wrapId) {
    var wrap = document.getElementById(wrapId);
    if (wrap && !wrap.contains(e.target)) {
      var panel = wrap.querySelector('[id$="-dropdown-panel"]');
      if (panel) panel.style.display = 'none';
    }
  });
});
</script>
</body>
</html>
