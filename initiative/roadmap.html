<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Roadmap — GDB</title>
<link rel="stylesheet" href="../css/shared.css">
<link rel="stylesheet" href="../css/gdb-shared.css">
<link rel="stylesheet" href="../css/initiative.css">
</head>
<body class="has-init-subnav">

<div id="gdb-error"></div>
<div id="gdb-loading"><div class="gdb-spinner"></div><div class="gdb-loading-text">Loading…</div></div>

<div id="rm-page" class="gdb-page" style="display:none">

  <!-- ── Print-only title ─────────────────────────────────── -->
  <div class="rm-print-hd">
    <strong>Roadmap <span id="rm-print-year"></span></strong>
    <span>Generated <span id="rm-print-date"></span></span>
  </div>

  <!-- ── Filter bar ─────────────────────────────────────── -->
  <div class="rm-ctrl-row">
    <span class="fb-label">Roadmap year:</span>
    <div id="rm-year-btns" style="display:flex;gap:5px"></div>

    <div class="rm-sep"></div>

    <!-- Status -->
    <div style="position:relative" id="rm-status-wrap">
      <button class="rm-dd-btn" onclick="toggleDropdown('rm-status-panel')">
        <span id="rm-status-lbl" data-empty="All Lifecycle Status">All Lifecycle Status</span>
        <span class="arr">▾</span>
      </button>
      <div id="rm-status-panel" style="display:none;position:absolute;top:30px;left:0;z-index:200;background:var(--surface);border:1px solid var(--border);border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.25);padding:8px 0;min-width:185px">
        <div id="rm-status-list"></div>
        <div style="border-top:1px solid var(--border);margin-top:6px;padding:5px 12px 2px">
          <button onclick="clearRmStatusFilter()" style="font-size:10px;color:var(--text3);background:none;border:none;cursor:pointer;padding:0">Clear all</button>
        </div>
      </div>
    </div>

    <!-- Component -->
    <div style="position:relative" id="rm-comp-wrap">
      <button class="rm-dd-btn" onclick="toggleDropdown('rm-comp-panel')">
        <span id="rm-comp-lbl" data-empty="All Components">All Components</span>
        <span class="arr">▾</span>
      </button>
      <div id="rm-comp-panel" style="display:none;position:absolute;top:30px;left:0;z-index:200;background:var(--surface);border:1px solid var(--border);border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.25);padding:8px 0;min-width:210px">
        <div id="rm-comp-list"></div>
      </div>
    </div>

    <!-- Dependency System -->
    <div style="position:relative" id="rm-dep-wrap">
      <button class="rm-dd-btn" onclick="toggleDropdown('rm-dep-panel')">
        <span id="rm-dep-lbl" data-empty="All Systems">All Systems</span>
        <span class="arr">▾</span>
      </button>
      <div id="rm-dep-panel" style="display:none;position:absolute;top:30px;left:0;z-index:200;background:var(--surface);border:1px solid var(--border);border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.25);padding:8px 0;min-width:160px;max-height:260px;overflow-y:auto">
        <div id="rm-dep-list"></div>
        <div style="border-top:1px solid var(--border);margin-top:6px;padding:5px 12px 2px">
          <button onclick="clearRmDepFilter()" style="font-size:10px;color:var(--text3);background:none;border:none;cursor:pointer;padding:0">Clear all</button>
        </div>
      </div>
    </div>

    <!-- PM Role -->
    <div style="position:relative" id="rm-pm-wrap">
      <button class="rm-dd-btn" onclick="toggleDropdown('rm-pm-panel')">
        <span id="rm-pm-lbl" data-empty="All PM Roles">All PM Roles</span>
        <span class="arr">▾</span>
      </button>
      <div id="rm-pm-panel" style="display:none;position:absolute;top:30px;left:0;z-index:200;background:var(--surface);border:1px solid var(--border);border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.25);padding:8px 0;min-width:170px;max-height:260px;overflow-y:auto">
        <div id="rm-pm-list"></div>
        <div style="border-top:1px solid var(--border);margin-top:6px;padding:5px 12px 2px">
          <button onclick="clearRmPMFilter()" style="font-size:10px;color:var(--text3);background:none;border:none;cursor:pointer;padding:0">Clear all</button>
        </div>
      </div>
    </div>

    <div style="flex:1"></div>

    <!-- Hide no-date toggle -->
    <button id="rm-hide-nodate" onclick="onRmHideNoDate()" title="Hide initiatives with no target date">
      <span class="tog-track"><span class="tog-thumb"></span></span>
      <span class="tog-label">Hide no date</span>
    </button>

    <!-- Export PDF -->
    <button class="rm-pdf-btn" onclick="exportRoadmapPDF()" title="Export to PDF (1 page)">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor">
        <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/>
        <path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3z"/>
      </svg>
      PDF
    </button>

    <span id="rm-count" class="rm-count"></span>

    <!-- Search -->
    <div class="rm-search-wrap">
      <input class="rm-search" type="search" placeholder="Search…" oninput="onRmSearchChange(this.value)">
    </div>

    <button onclick="resetRoadmapFilters()" style="height:26px;padding:0 10px;border:1px solid var(--border);border-radius:4px;background:none;color:var(--text3);font-size:11px;cursor:pointer;white-space:nowrap" title="Reset all filters to default">↺ Reset Filter</button>
  </div>

  <!-- ── Table ──────────────────────────────────────────── -->
  <div class="rm-table-wrap">
    <div id="rm-table-container"></div>
  </div>

  <!-- ── Legend ─────────────────────────────────────────── -->
  <div class="rm-legend">
    <span style="font-size:10px;color:var(--text3);font-weight:600;margin-right:2px">Status:</span>
    <span class="rm-li"><span class="rm-li-bar" style="background:#6BAED4"></span>Delivery</span>
    <span class="rm-li"><span class="rm-li-bar" style="background:#9B8FE0"></span>Ready for Delivery</span>
    <span class="rm-li"><span class="rm-li-bar" style="background:#D4A850"></span>Discovery</span>
    <span class="rm-li"><span class="rm-li-bar" style="background:#6DBF9A"></span>Done</span>
    <span class="rm-li"><span class="rm-li-bar" style="background:#E07878"></span>Budget Approval</span>
    <span class="rm-li"><span class="rm-li-bar" style="background:#484f58"></span>Parking Lot</span>
  </div>

</div>

<span id="refresh-time" style="display:none"></span>
<span id="current-dt"   style="display:none"></span>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="../js/initiative/config.js"></script>
<script src="../js/initiative/component-groups.js"></script>
<script src="../js/roles.js"></script>
<script src="../js/header.js"></script>
<script src="../js/shared/gdb-utils.js"></script>
<script src="../js/initiative/render.js"></script>
<script src="../js/initiative/data.js"></script>
<script>
window.onDataReady = function() {
  document.getElementById('gdb-loading').style.display = 'none';
  document.getElementById('rm-page').style.display = 'block';
  renderRoadmap();
};

window.addEventListener('DOMContentLoaded', function() {
  buildGdbHeader({ showRefresh: true });
  buildGdbInitiativeSubNav();
  gdbAuthGuard(function() { loadData(); });
  document.addEventListener('click', function(e) {
    if (e.target && e.target.id === 'gdb-refresh-btn') {
      document.getElementById('gdb-loading').style.display = 'flex';
      document.getElementById('rm-page').style.display = 'none';
      loadData();
    }
  });
});

function exportRoadmapPDF() {
  var container = document.getElementById('rm-table-container');
  if (!container) return;

  var year  = rmYearFilter || '';
  var date  = new Date().toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'});
  var count = (document.getElementById('rm-count') || {}).textContent || '';

  var win = window.open('', '_blank');
  if (!win) { alert('Please allow popups for this site to export PDF.'); return; }

  /* ── Light-theme CSS for clean print ─────────────────────────── */
  var css =
    '@page{size:A3 landscape;margin:10mm}' +
    '*{box-sizing:border-box;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}' +
    'body{font-family:-apple-system,system-ui,sans-serif;font-size:10px;background:#fff;color:#1a1a2e;margin:0;padding:8px;min-height:0}' +
    '.prt-hdr{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;padding-bottom:5px;border-bottom:2px solid #dde1e7}' +
    '.prt-hdr strong{font-size:14px;font-weight:700}' +
    '.prt-hdr span{font-size:9px;color:#888}' +
    /* table */
    '.rm-table{width:100%;border-collapse:collapse;table-layout:fixed}' +
    '.rm-goal-hd{width:140px;padding:6px 8px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#888;background:#f0f2f5;border:1px solid #dde1e7}' +
    '.rm-q-hd{padding:6px 8px;background:#f0f2f5;border:1px solid #dde1e7}' +
    '.rm-q-label{display:block;font-size:11px;font-weight:700;line-height:1;margin-bottom:1px}' +
    '.rm-q-sub{font-size:9px;color:#888}' +
    '.rm-now-tag{font-size:8px;font-weight:700;color:#e65100;background:#fff3e0;border:1px solid #ff9800;border-radius:2px;padding:0 3px;margin-left:4px}' +
    '.rm-q1 .rm-q-label{color:#1565c0}.rm-q2 .rm-q-label{color:#e65100}.rm-q3 .rm-q-label{color:#2e7d32}.rm-q4 .rm-q-label{color:#6a1b9a}' +
    '.rm-qnow{background:#fffde7!important}' +
    /* goal cell */
    '.rm-goal-lbl{padding:7px 8px;background:#f5f7fa;border:1px solid #dde1e7;vertical-align:top}' +
    '.rm-goal-name{display:flex;align-items:flex-start;gap:5px;font-size:10px;font-weight:700;color:#1a1a2e;line-height:1.4;white-space:normal;word-break:break-word}' +
    '.rm-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:2px}' +
    '.rm-goal-count{font-size:9px;color:#888;margin-top:3px;margin-left:12px}' +
    '.rm-nodate-badge{font-size:8px;color:#888;border:1px solid #ccc;border-radius:2px;padding:0 3px}' +
    /* quarter cells */
    '.rm-qcell{border:1px solid #dde1e7;padding:4px 5px;vertical-align:top}.rm-qcell-now{background:#fffde7}' +
    /* chips */
    '.rm-chip{display:block;text-decoration:none;border-left:2px solid transparent;border-radius:0 3px 3px 0;padding:3px 5px;margin-bottom:2px}' +
    '.rm-chip:last-child{margin-bottom:0}' +
    '.rm-chip-key{display:block;font-size:8.5px;font-weight:700;font-family:monospace;letter-spacing:.03em;margin-bottom:1px}' +
    '.rm-chip-name{display:block;font-size:10px;font-weight:500;color:#1a1a2e;line-height:1.3;margin-bottom:1px}' +
    '.rm-chip-owner{display:block;font-size:8.5px;color:#666;margin-bottom:2px}' +
    '.rm-chip-badges{display:flex;flex-wrap:wrap;gap:2px}' +
    '.rm-badge{font-size:8px;font-weight:600;padding:0 4px;border-radius:2px;line-height:14px}' +
    /* chip status colours – light-theme remaps */
    '.rm-delivery{border-left-color:#1565c0;background:rgba(21,101,192,.07)}.rm-delivery .rm-chip-key{color:#1565c0}' +
    '.rm-rfd{border-left-color:#6a1b9a;background:rgba(106,27,154,.07)}.rm-rfd .rm-chip-key{color:#6a1b9a}' +
    '.rm-discovery{border-left-color:#e65100;background:rgba(230,81,0,.07)}.rm-discovery .rm-chip-key{color:#e65100}' +
    '.rm-done{border-left-color:#2e7d32;background:rgba(46,125,50,.06)}.rm-done .rm-chip-key{color:#2e7d32}' +
    '.rm-budget{border-left-color:#b71c1c;background:rgba(183,28,28,.06)}.rm-budget .rm-chip-key{color:#b71c1c}' +
    '.rm-parking{border-left-color:#9e9e9e;background:rgba(0,0,0,.04)}.rm-parking .rm-chip-key{color:#9e9e9e}.rm-parking .rm-chip-name{color:#555}';

  /* ── Auto-fit zoom then print ─────────────────────────────────── */
  var autoScript =
    'window.onload=function(){' +
      'var t=document.querySelector(".rm-table");' +
      'if(t){' +
        /* A3 landscape printable: 404mm × 281mm at 96dpi ≈ 1527 × 1062px */
        'var z=Math.min(1,1527/(t.offsetWidth||1),1062/(t.offsetHeight||1));' +
        't.style.zoom=z.toFixed(3);' +
      '}' +
      'window.print();' +
      'setTimeout(function(){window.close();},500);' +
    '};';

  win.document.write(
    '<!DOCTYPE html><html><head><meta charset="UTF-8">' +
    '<title>Roadmap ' + year + '</title>' +
    '<style>' + css + '</style></head><body>' +
    '<div class="prt-hdr"><strong>Roadmap ' + year + '</strong>' +
    '<span>' + count + ' · Generated ' + date + '</span></div>' +
    container.innerHTML +
    '<script>' + autoScript + '<\/script>' +
    '</body></html>'
  );
  win.document.close();
}

function toggleDropdown(panelId) {
  var panel = document.getElementById(panelId);
  if (!panel) return;
  var isOpen = panel.style.display !== 'none';
  document.querySelectorAll('.rm-dd-panel').forEach(function(p) { p.style.display = 'none'; });
  ['rm-comp-panel','rm-pm-panel','rm-status-panel'].forEach(function(id) {
    var p = document.getElementById(id); if (p) p.style.display = 'none';
  });
  panel.style.display = isOpen ? 'none' : 'block';
}
document.addEventListener('click', function(e) {
  ['rm-status-wrap','rm-comp-wrap','rm-dep-wrap','rm-pm-wrap'].forEach(function(id) {
    var wrap = document.getElementById(id);
    if (wrap && !wrap.contains(e.target)) {
      ['rm-comp-panel','rm-pm-panel','rm-status-panel'].forEach(function(pid) {
        if (wrap.querySelector('#' + pid)) {
          var p = document.getElementById(pid); if (p) p.style.display = 'none';
        }
      });
    }
  });
});
</script>
</body>
</html>
