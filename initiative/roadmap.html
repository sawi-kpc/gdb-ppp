<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Roadmap — GDB</title>
<link rel="stylesheet" href="../css/shared.css">
<link rel="stylesheet" href="../css/gdb-shared.css">
<link rel="stylesheet" href="../css/initiative.css">
<style>
/* ── Roadmap layout ─────────────────────────────────────────── */
#rm-page { padding: 0 !important; max-width: none !important; }

.rm-ctrl-row {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 9px 16px; border-bottom: 1px solid var(--border);
  background: var(--surface2);
}
.rm-ctrl-lbl { font-size: 11px; color: var(--text3); white-space: nowrap; font-weight: 500; }
.rm-sep { width: 1px; height: 16px; background: var(--border); flex-shrink: 0; }

/* Year pill buttons */
.rm-yr-btn {
  padding: 2px 12px; border-radius: 20px;
  border: 1px solid var(--border); background: transparent;
  color: var(--text2); font-size: 11px; font-weight: 600;
  cursor: pointer; transition: all .15s; line-height: 20px;
}
.rm-yr-btn.on  { background: var(--accent); border-color: var(--accent); color: #fff; }
.rm-yr-btn:hover:not(.on) { border-color: var(--text2); color: var(--text); }

/* Dropdown trigger buttons */
.rm-dd-btn {
  height: 26px; padding: 0 10px;
  border: 1px solid var(--border); border-radius: 4px;
  background: var(--surface2); color: var(--text);
  font-size: 11px; cursor: pointer;
  display: flex; align-items: center; gap: 5px; white-space: nowrap;
  transition: border-color .15s;
}
.rm-dd-btn:hover { border-color: var(--text3); }
.rm-dd-btn .arr { font-size: 8px; color: var(--text3); margin-top: 1px; }

/* Search */
.rm-search {
  height: 26px; padding: 0 8px 0 26px;
  border: 1px solid var(--border); border-radius: 4px;
  background: var(--surface2); color: var(--text);
  font-size: 11px; width: 160px; outline: none;
  transition: border-color .15s;
}
.rm-search:focus { border-color: var(--accent); }
.rm-search-wrap { position: relative; }
.rm-search-wrap::before {
  content: '⌕'; position: absolute; left: 7px; top: 50%;
  transform: translateY(-50%); color: var(--text3);
  font-size: 14px; pointer-events: none;
}

.rm-count { font-size: 10px; color: var(--text3); }

/* ── Table wrapper ────────────────────────────────────────── */
.rm-table-wrap { overflow: auto; }

/* ── Table ────────────────────────────────────────────────── */
.rm-table {
  width: 100%; border-collapse: collapse;
  table-layout: fixed; min-width: 640px;
}

/* Column header */
.rm-goal-hd {
  width: 172px; text-align: left;
  font-size: 10px; font-weight: 600; color: var(--text3);
  text-transform: uppercase; letter-spacing: .07em;
  background: var(--surface); border-bottom: 2px solid var(--border);
  padding: 8px 12px;
  position: sticky; top: 0; left: 0; z-index: 40;
  border-right: 1px solid var(--border);
}
.rm-q-hd {
  text-align: left; padding: 7px 12px;
  background: var(--surface); border-bottom: 2px solid var(--border);
  position: sticky; top: 0; z-index: 30;
  border-right: 1px solid var(--border);
}
.rm-q-hd:last-child { border-right: none; }
.rm-q-label {
  display: block; font-size: 12px; font-weight: 700; line-height: 1;
  margin-bottom: 2px;
}
.rm-q-sub   { font-size: 10px; font-weight: 400; color: var(--text3); }
.rm-now-tag {
  display: inline-block; font-size: 9px; font-weight: 700;
  color: #d29922; background: rgba(210,153,34,.13);
  border: 1px solid rgba(210,153,34,.3); border-radius: 3px;
  padding: 0 5px; margin-left: 5px; vertical-align: middle;
  line-height: 16px;
}
.rm-q1 .rm-q-label { color: #58a6ff; }
.rm-q2 .rm-q-label { color: #d29922; }
.rm-q3 .rm-q-label { color: #3fb950; }
.rm-q4 .rm-q-label { color: #bc8cff; }
.rm-qnow { background: rgba(210,153,34,.03); }

/* Row hover */
.rm-row:hover .rm-goal-lbl,
.rm-row:hover .rm-qcell { background-color: rgba(255,255,255,.013); }
.rm-row:hover .rm-goal-lbl { background-color: rgba(255,255,255,.02); }

/* Goal label cell */
.rm-goal-lbl {
  position: sticky; left: 0; z-index: 20;
  width: 172px;
  background: var(--surface2);
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  padding: 10px 12px;
  vertical-align: top;
  transition: background .12s;
}
.rm-goal-name {
  display: flex; align-items: center; gap: 6px;
  font-size: 11px; font-weight: 700; color: var(--text);
  line-height: 1.4; white-space: nowrap;
}
.rm-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
}
.rm-goal-count {
  margin-top: 4px; margin-left: 14px;
  font-size: 10px; color: var(--text3);
}
.rm-nodate-badge {
  display: inline-block; font-size: 9px; font-weight: 500;
  color: var(--text3); background: var(--surface);
  border: 1px solid var(--border); border-radius: 3px;
  padding: 1px 5px; margin-top: 2px;
}

/* Quarter cells */
.rm-qcell {
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  padding: 6px 7px; vertical-align: top;
  transition: background .12s;
}
.rm-qcell:last-child { border-right: none; }
.rm-qcell-now { background: rgba(210,153,34,.025); }

/* ── Initiative chips ─────────────────────────────────────── */
.rm-chip {
  display: block;
  text-align: left;
  text-decoration: none;
  border-radius: 0 4px 4px 0;
  border-left: 2px solid transparent;
  padding: 5px 8px;
  margin-bottom: 3px;
  transition: background .12s, transform .1s;
}
.rm-chip:last-child { margin-bottom: 0; }
.rm-chip:hover      { transform: translateX(2px); text-decoration: none; }

.rm-chip-key {
  display: block;
  font-size: 9.5px; font-weight: 700;
  font-family: ui-monospace, 'SF Mono', 'Fira Mono', monospace;
  letter-spacing: .03em;
  margin-bottom: 2px;
}
.rm-chip-name {
  display: block;
  font-size: 11px; font-weight: 500;
  color: var(--text); line-height: 1.4;
  margin-bottom: 2px;
}
.rm-chip-owner {
  display: block;
  font-size: 10px; color: var(--text3);
}

/* Status colours — left-border + tinted bg */
.rm-delivery  { border-left-color: #6BAED4; background: rgba(107,174,212,.1);  }
.rm-delivery  .rm-chip-key { color: #6BAED4; }
.rm-delivery:hover           { background: rgba(107,174,212,.18); }

.rm-rfd       { border-left-color: #9B8FE0; background: rgba(155,143,224,.1);  }
.rm-rfd       .rm-chip-key { color: #9B8FE0; }
.rm-rfd:hover                { background: rgba(155,143,224,.18); }

.rm-discovery { border-left-color: #D4A850; background: rgba(212,168,80,.1);   }
.rm-discovery .rm-chip-key { color: #D4A850; }
.rm-discovery:hover          { background: rgba(212,168,80,.18); }

.rm-done      { border-left-color: #6DBF9A; background: rgba(109,191,154,.08); }
.rm-done      .rm-chip-key { color: #6DBF9A; }
.rm-done:hover               { background: rgba(109,191,154,.16); }

.rm-budget    { border-left-color: #E07878; background: rgba(224,120,120,.08); }
.rm-budget    .rm-chip-key { color: #E07878; }
.rm-budget:hover             { background: rgba(224,120,120,.16); }

.rm-parking   { border-left-color: #484f58; background: rgba(72,79,88,.12);    }
.rm-parking   .rm-chip-key { color: #8b949e; }
.rm-parking   .rm-chip-name { color: var(--text2); }
.rm-parking:hover            { background: rgba(72,79,88,.2); }

/* ── Legend ───────────────────────────────────────────────── */
.rm-legend {
  display: flex; align-items: center; gap: 16px;
  padding: 7px 16px;
  background: var(--surface); border-top: 1px solid var(--border);
  flex-wrap: wrap;
}
.rm-li {
  display: flex; align-items: center; gap: 6px;
  font-size: 10px; color: var(--text3);
}
.rm-li-bar {
  width: 3px; height: 12px; border-radius: 2px; flex-shrink: 0;
}
</style>
</head>
<body class="has-init-subnav">

<div id="gdb-error"></div>
<div id="gdb-loading"><div class="gdb-spinner"></div><div class="gdb-loading-text">Loading…</div></div>

<div id="rm-page" class="gdb-page" style="display:none">

  <!-- ── Filter bar ─────────────────────────────────────── -->
  <div class="rm-ctrl-row">
    <span class="rm-ctrl-lbl">Year</span>
    <div id="rm-year-btns" style="display:flex;gap:5px"></div>

    <div class="rm-sep"></div>

    <!-- Component -->
    <div style="position:relative" id="rm-comp-wrap">
      <button class="rm-dd-btn" onclick="toggleDropdown('rm-comp-panel')">
        <span id="rm-comp-lbl" data-empty="All Components">All Components</span>
        <span class="arr">▾</span>
      </button>
      <div id="rm-comp-panel" style="display:none;position:absolute;top:30px;left:0;z-index:200;background:var(--surface);border:1px solid var(--border);border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.25);padding:8px 0;min-width:210px;max-height:260px;overflow-y:auto">
        <div id="rm-comp-list"></div>
        <div style="border-top:1px solid var(--border);margin-top:6px;padding:5px 12px 2px">
          <button onclick="clearRmCompFilter()" style="font-size:10px;color:var(--text3);background:none;border:none;cursor:pointer;padding:0">Clear all</button>
        </div>
      </div>
    </div>

    <!-- PM Role -->
    <div style="position:relative" id="rm-pm-wrap">
      <button class="rm-dd-btn" onclick="toggleDropdown('rm-pm-panel')">
        <span id="rm-pm-lbl" data-empty="All PM Roles">All PM Roles</span>
        <span class="arr">▾</span>
      </button>
      <div id="rm-pm-panel" style="display:none;position:absolute;top:30px;left:0;z-index:200;background:var(--surface);border:1px solid var(--border);border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.25);padding:8px 0;min-width:170px;max-height:260px;overflow-y:auto">
        <div id="rm-pm-list"></div>
        <div style="border-top:1px solid var(--border);margin-top:6px;padding:5px 12px 2px">
          <button onclick="clearRmPMFilter()" style="font-size:10px;color:var(--text3);background:none;border:none;cursor:pointer;padding:0">Clear all</button>
        </div>
      </div>
    </div>

    <!-- Status -->
    <div style="position:relative" id="rm-status-wrap">
      <button class="rm-dd-btn" onclick="toggleDropdown('rm-status-panel')">
        <span id="rm-status-lbl" data-empty="All Statuses">All Statuses</span>
        <span class="arr">▾</span>
      </button>
      <div id="rm-status-panel" style="display:none;position:absolute;top:30px;left:0;z-index:200;background:var(--surface);border:1px solid var(--border);border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.25);padding:8px 0;min-width:185px">
        <div id="rm-status-list"></div>
        <div style="border-top:1px solid var(--border);margin-top:6px;padding:5px 12px 2px">
          <button onclick="clearRmStatusFilter()" style="font-size:10px;color:var(--text3);background:none;border:none;cursor:pointer;padding:0">Clear all</button>
        </div>
      </div>
    </div>

    <div style="flex:1"></div>

    <!-- Search -->
    <div class="rm-search-wrap">
      <input class="rm-search" type="search" placeholder="Search…" oninput="onRmSearchChange(this.value)">
    </div>
    <span id="rm-count" class="rm-count"></span>
  </div>

  <!-- ── Table ──────────────────────────────────────────── -->
  <div class="rm-table-wrap">
    <div id="rm-table-container"></div>
  </div>

  <!-- ── Legend ─────────────────────────────────────────── -->
  <div class="rm-legend">
    <span style="font-size:10px;color:var(--text3);font-weight:600;margin-right:2px">Status:</span>
    <span class="rm-li"><span class="rm-li-bar" style="background:#6BAED4"></span>Delivery</span>
    <span class="rm-li"><span class="rm-li-bar" style="background:#9B8FE0"></span>Ready for Delivery</span>
    <span class="rm-li"><span class="rm-li-bar" style="background:#D4A850"></span>Discovery</span>
    <span class="rm-li"><span class="rm-li-bar" style="background:#6DBF9A"></span>Done</span>
    <span class="rm-li"><span class="rm-li-bar" style="background:#E07878"></span>Budget Approval</span>
    <span class="rm-li"><span class="rm-li-bar" style="background:#484f58"></span>Parking Lot</span>
  </div>

</div>

<span id="refresh-time" style="display:none"></span>
<span id="current-dt"   style="display:none"></span>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="../js/initiative/config.js"></script>
<script src="../js/header.js"></script>
<script src="../js/shared/gdb-utils.js"></script>
<script src="../js/initiative/render.js"></script>
<script src="../js/initiative/data.js"></script>
<script>
window.onDataReady = function() {
  document.getElementById('gdb-loading').style.display = 'none';
  document.getElementById('rm-page').style.display = 'block';
  renderRoadmap();
};

window.addEventListener('DOMContentLoaded', function() {
  buildGdbHeader({ showRefresh: true });
  buildGdbInitiativeSubNav();
  gdbAuthGuard(function() { loadData(); });
  document.addEventListener('click', function(e) {
    if (e.target && e.target.id === 'gdb-refresh-btn') {
      document.getElementById('gdb-loading').style.display = 'flex';
      document.getElementById('rm-page').style.display = 'none';
      loadData();
    }
  });
});

function toggleDropdown(panelId) {
  var panel = document.getElementById(panelId);
  if (!panel) return;
  var isOpen = panel.style.display !== 'none';
  document.querySelectorAll('.rm-dd-panel').forEach(function(p) { p.style.display = 'none'; });
  ['rm-comp-panel','rm-pm-panel','rm-status-panel'].forEach(function(id) {
    var p = document.getElementById(id); if (p) p.style.display = 'none';
  });
  panel.style.display = isOpen ? 'none' : 'block';
}
document.addEventListener('click', function(e) {
  ['rm-comp-wrap','rm-pm-wrap','rm-status-wrap'].forEach(function(id) {
    var wrap = document.getElementById(id);
    if (wrap && !wrap.contains(e.target)) {
      ['rm-comp-panel','rm-pm-panel','rm-status-panel'].forEach(function(pid) {
        if (wrap.querySelector('#' + pid)) {
          var p = document.getElementById(pid); if (p) p.style.display = 'none';
        }
      });
    }
  });
});
</script>
</body>
</html>
