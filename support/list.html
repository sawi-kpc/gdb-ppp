<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Support Tasks — List — GDB</title>
<link rel="stylesheet" href="../css/shared.css">
<link rel="stylesheet" href="../css/gdb-shared.css">
<link rel="stylesheet" href="../css/support.css">
</head>
<body class="has-init-subnav">
<div id="gdb-error" style="display:none;padding:12px 20px;background:rgba(248,81,73,.1);border-bottom:1px solid rgba(248,81,73,.3);color:var(--down);font-size:12px"></div>

<div id="gdb-loading" class="gdb-loading-state"><div class="gdb-spinner-wrap"></div>Loading support tasks…</div>

<div id="support-content" style="display:none">

<div id="support-error-state" class="gdb-error-state">
  <div style="font-size:40px;opacity:.6">⚠</div>
  <div style="font-size:16px;font-weight:700;color:var(--down)">Unable to load support data</div>
  <div id="support-error-msg" style="font-size:13px;color:var(--text2);max-width:420px;line-height:1.6"></div>
  <div style="margin-top:8px">
    <button onclick="location.reload()" style="padding:8px 20px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px;cursor:pointer">↺ Retry</button>
  </div>
</div>

<div class="gdb-page-content">

<div class="panel">
  <div class="panel-head">
    <div><div class="panel-title">All Tasks</div><div class="panel-sub" id="task-count-label"></div></div>
  </div>
  <div class="panel-body">
    <!-- Filter bar -->
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px">

      <!-- Status dropdown -->
      <div style="position:relative" id="status-dropdown-wrap">
        <button id="status-dropdown-btn" onclick="toggleSupportDropdown('status-dropdown-panel')"
          style="height:26px;padding:0 10px;border:1px solid var(--border);border-radius:4px;background:var(--surface2);color:var(--text);font-size:11.5px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap">
          <span id="status-btn-label" data-empty="All Statuses">All Statuses</span>
          <span style="font-size:9px;color:var(--text3)">▾</span>
        </button>
        <div id="status-dropdown-panel" style="display:none;position:absolute;top:30px;left:0;z-index:200;background:var(--surface);border:1px solid var(--border);border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,0.18);padding:8px 0;min-width:160px">
          <div id="status-checkbox-list"></div>
          <div style="border-top:1px solid var(--border);margin-top:6px;padding:6px 12px 2px">
            <button onclick="clearSupportStatus()" style="font-size:10px;color:var(--text3);background:none;border:none;cursor:pointer;padding:0">Clear all</button>
          </div>
        </div>
      </div>

      <!-- Priority dropdown -->
      <div style="position:relative" id="priority-dropdown-wrap">
        <button id="priority-dropdown-btn" onclick="toggleSupportDropdown('priority-dropdown-panel')"
          style="height:26px;padding:0 10px;border:1px solid var(--border);border-radius:4px;background:var(--surface2);color:var(--text);font-size:11.5px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap">
          <span id="priority-btn-label" data-empty="All Priorities">All Priorities</span>
          <span style="font-size:9px;color:var(--text3)">▾</span>
        </button>
        <div id="priority-dropdown-panel" style="display:none;position:absolute;top:30px;left:0;z-index:200;background:var(--surface);border:1px solid var(--border);border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,0.18);padding:8px 0;min-width:160px">
          <div id="priority-checkbox-list"></div>
          <div style="border-top:1px solid var(--border);margin-top:6px;padding:6px 12px 2px">
            <button onclick="clearSupportPriority()" style="font-size:10px;color:var(--text3);background:none;border:none;cursor:pointer;padding:0">Clear all</button>
          </div>
        </div>
      </div>

      <div style="width:1px;height:20px;background:var(--border);flex-shrink:0"></div>

      <!-- Group dropdown -->
      <div style="position:relative" id="group-dropdown-wrap">
        <button id="group-dropdown-btn" onclick="toggleSupportDropdown('group-dropdown-panel')"
          style="height:26px;padding:0 10px;border:1px solid var(--border);border-radius:4px;background:var(--surface2);color:var(--text);font-size:11.5px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap">
          <span id="group-btn-label" data-empty="All Groups">All Groups</span>
          <span style="font-size:9px;color:var(--text3)">▾</span>
        </button>
        <div id="group-dropdown-panel" style="display:none;position:absolute;top:30px;left:0;z-index:200;background:var(--surface);border:1px solid var(--border);border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,0.18);padding:8px 0;min-width:200px">
          <div id="group-checkbox-list"></div>
          <div style="border-top:1px solid var(--border);margin-top:6px;padding:6px 12px 2px">
            <button onclick="clearSupportGroup()" style="font-size:10px;color:var(--text3);background:none;border:none;cursor:pointer;padding:0">Clear all</button>
          </div>
        </div>
      </div>

      <!-- Labels dropdown -->
      <div style="position:relative" id="label-dropdown-wrap">
        <button id="label-dropdown-btn" onclick="toggleSupportDropdown('label-dropdown-panel')"
          style="height:26px;padding:0 10px;border:1px solid var(--border);border-radius:4px;background:var(--surface2);color:var(--text);font-size:11.5px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap">
          <span id="label-btn-label" data-empty="All Labels">All Labels</span>
          <span style="font-size:9px;color:var(--text3)">▾</span>
        </button>
        <div id="label-dropdown-panel" style="display:none;position:absolute;top:30px;left:0;z-index:200;background:var(--surface);border:1px solid var(--border);border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,0.18);padding:8px 0;min-width:240px;white-space:nowrap">
          <div id="label-checkbox-list"></div>
          <div style="border-top:1px solid var(--border);margin-top:6px;padding:6px 12px 2px">
            <button onclick="clearSupportLabel()" style="font-size:10px;color:var(--text3);background:none;border:none;cursor:pointer;padding:0">Clear all</button>
          </div>
        </div>
      </div>

      <!-- Assignee dropdown -->
      <div style="position:relative" id="assignee-dropdown-wrap">
        <button id="assignee-dropdown-btn" onclick="toggleSupportDropdown('assignee-dropdown-panel')"
          style="height:26px;padding:0 10px;border:1px solid var(--border);border-radius:4px;background:var(--surface2);color:var(--text);font-size:11.5px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap">
          <span id="assignee-btn-label" data-empty="All Assignees">All Assignees</span>
          <span style="font-size:9px;color:var(--text3)">▾</span>
        </button>
        <div id="assignee-dropdown-panel" style="display:none;position:absolute;top:30px;left:0;z-index:200;background:var(--surface);border:1px solid var(--border);border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,0.18);padding:8px 0;min-width:200px;white-space:nowrap">
          <div id="assignee-checkbox-list"></div>
          <div style="border-top:1px solid var(--border);margin-top:6px;padding:6px 12px 2px">
            <button onclick="clearSupportAssignee()" style="font-size:10px;color:var(--text3);background:none;border:none;cursor:pointer;padding:0">Clear all</button>
          </div>
        </div>
      </div>

      <div style="flex:1"></div>

      <!-- Overdue toggle -->
      <button id="btn-overdue-only" onclick="toggleOverdueOnly()">
        <span class="tog-track"><span class="tog-thumb"></span></span>
        <span class="tog-label">Overdue only</span>
      </button>

      <!-- Search -->
      <div class="search-wrap"><input type="text" id="search" placeholder="Search…" oninput="applyFilters()"></div>
      <button onclick="resetSupportFilters()" style="height:26px;padding:0 10px;border:1px solid var(--border);border-radius:4px;background:none;color:var(--text3);font-size:11px;cursor:pointer;white-space:nowrap" title="Reset all filters to default">↺ Reset Filter</button>
    </div>
    <div class="pg-bar" id="task-pg-top"></div>
    <div class="tbl-scroll">
      <table class="ttbl">
        <thead id="task-thead"><tr>
          <th data-col="Key"      onclick="sortBy('Key')">Key</th>
          <th data-col="Summary"  onclick="sortBy('Summary')">Summary</th>
          <th data-col="Status"   onclick="sortBy('Status')">Status</th>
          <th data-col="Group"    onclick="sortBy('Group')">Group</th>
          <th>Component</th>
          <th data-col="Assignee" onclick="sortBy('Assignee')">Assignee</th>
          <th data-col="Due date" onclick="sortBy('Due date')">Due date</th>
          <th data-col="Hours"    onclick="sortBy('Hours')">Hours spent</th>
        </tr></thead>
        <tbody id="task-tbody"></tbody>
      </table>
      <div class="pg-bar" id="task-pg-bot"></div>
    </div>
  </div>
</div>

</div><!-- /gdb-page-content -->
</div><!-- /support-content -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="../js/support/config.js"></script>
<script src="../js/roles.js"></script>
<script src="../js/header.js"></script>
<script src="../js/support/data.js"></script>
<script src="../js/shared/gdb-utils.js"></script>
<script src="../js/support/render.js"></script>
<script src="../js/support/render_patch.js"></script>
<script>
function toggleSupportDropdown(panelId) {
  var panel = document.getElementById(panelId); if (!panel) return;
  panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
}
document.addEventListener('click', function(e) {
  ['status-dropdown-wrap','priority-dropdown-wrap','group-dropdown-wrap','label-dropdown-wrap','assignee-dropdown-wrap'].forEach(function(id) {
    var wrap = document.getElementById(id);
    if (wrap && !wrap.contains(e.target)) {
      var panel = wrap.querySelector('[id$="-panel"]');
      if (panel) panel.style.display = 'none';
    }
  });
});

window.addEventListener('DOMContentLoaded', function() {
  buildGdbHeader({ showRefresh: true });
  buildGdbSupportSubNav();
  gdbAuthGuard(function() {
    loadSupportData(
      function(data) {
        document.getElementById('gdb-loading').style.display = 'none';
        document.getElementById('support-content').style.display = 'block';
        if (typeof setGdbUpdateTime === 'function') setGdbUpdateTime(new Date().toISOString());
        init();
      },
      function(err) {
        document.getElementById('gdb-loading').style.display = 'none';
        document.getElementById('support-content').style.display = 'block';
        document.getElementById('support-error-state').style.display = 'flex';
        document.getElementById('support-error-msg').textContent = err;
      }
    );
  });

  var rbtn = document.getElementById('gdb-refresh-btn');
  if (rbtn) rbtn.addEventListener('click', function() {
    clearSupportCache();
    location.reload();
  });
});
</script>
</body>
</html>
