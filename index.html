<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GDB Dashboard — Sign in</title>
<link rel="stylesheet" href="css/shared.css">
<style>body{padding-top:0;}</style>
<script>
(function(){
  var theme = localStorage.getItem('gdb_theme') || 'dark';
  document.documentElement.setAttribute('data-theme', theme);
})();
</script>
</head>
<body class="auth-page">
<div class="auth-card">
  <div class="gdb-logo" style="width:48px;height:48px;border-radius:10px;font-size:16px;margin-bottom:16px">GDB</div>
  <div class="auth-logo">Group Digital Business Dashboard</div>
  <div class="auth-sub">King Power Digital Commerce</div>
  <button class="auth-btn" id="auth-login-btn">Sign in with King Power Account</button>
  <span class="auth-error" id="auth-error"></span>
  <p style="margin-top:16px;font-size:12px;color:#888;text-align:center;line-height:1.6">
    Don't have access? Contact us at<br>
    <a href="mailto:kpcproduct@kingpower.com" style="color:#58a6ff;text-decoration:none">kpcproduct@kingpower.com</a>
  </p>
</div>

<script src="js/keycloak-config.js"></script>
<script>
(function() {
  var btn = document.getElementById('auth-login-btn');
  var err = document.getElementById('auth-error');

  function loadKcAndInit() {
    var s = document.createElement('script');
    s.src = KC_CONFIG.url + '/js/keycloak.js';
    s.onload = function() {
      var kc = new Keycloak(KC_CONFIG);
      /* check-sso: silent redirect — if already logged in, go straight to app */
      kc.init({ onLoad: 'check-sso' })
        .then(function(authenticated) {
          if (authenticated) {
            window.location.href = 'initiative/';
            return;
          }
          /* Not logged in — enable login button */
          btn.disabled = false;
          btn.textContent = 'Sign in with King Power Account';
          btn.addEventListener('click', function() {
            btn.disabled = true;
            btn.textContent = 'Redirecting…';
            kc.login();
          });
        })
        .catch(function(e) {
          console.error('[KC] check-sso failed', e);
          err.textContent = 'Cannot reach authentication service. Check your network.';
          btn.disabled = false;
          btn.textContent = 'Sign in with King Power Account';
          btn.addEventListener('click', function() {
            btn.disabled = true;
            btn.textContent = 'Redirecting…';
            kc.login();
          });
        });
    };
    s.onerror = function() {
      err.textContent = 'Authentication service unavailable (' + KC_CONFIG.url + ')';
      btn.disabled = false;
      btn.textContent = 'Retry';
      btn.addEventListener('click', function() { window.location.reload(); });
    };
    document.head.appendChild(s);
  }

  btn.disabled = true;
  btn.textContent = 'Connecting…';
  loadKcAndInit();
})();
</script>
</body>
</html>
