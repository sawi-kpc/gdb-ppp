<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Issues — Dashboard — GDB Dashboard</title>
<link rel="stylesheet" href="../css/shared.css">
<link rel="stylesheet" href="../css/gdb-shared.css">
<link rel="stylesheet" href="../css/issue.css">
</head>
<body class="has-init-subnav">
<div id="gdb-error"></div>

<div class="gdb-page" id="main-content" style="display:none">
<div class="issue-content">

  <!-- Toolbar -->
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
    <span class="fb-label">Occurrence year:</span>
    <div id="dash-year-filter" style="display:flex;gap:6px;flex-wrap:wrap"></div>
    <div style="flex:1"></div>
    <button id="btn-hide-archived" onclick="toggleHideArchived()">
      <span class="tog-track"><span class="tog-thumb"></span></span>
      <span class="tog-label">Hide Archived</span>
    </button>
    <button onclick="resetIssueFilters()" style="height:26px;padding:0 10px;border:1px solid var(--border);border-radius:4px;background:none;color:var(--text3);font-size:11px;cursor:pointer;white-space:nowrap" title="Reset all filters to default">↺ Reset Filter</button>
  </div>

  <!-- KPI row -->
  <div class="kpi-grid" id="issue-kpi" style="margin-bottom:14px;grid-template-columns:repeat(7,1fr)"></div>

  <!-- Charts row -->
  <div class="chart-grid" style="margin-bottom:14px">
    <div class="chart-card" id="chart-status"></div>
    <div class="chart-card" id="chart-priority"></div>
  </div>

  <!-- Risk + Performance Heatmap -->
  <div class="panel">
    <div class="panel-body" style="display:grid;grid-template-columns:1fr 1fr;gap:24px;min-width:0">
      <div id="chart-risk" style="min-width:0;overflow:hidden"></div>
      <div id="chart-perf" style="min-width:0;overflow:hidden"></div>
    </div>
  </div>

</div><!-- /issue-content -->
</div><!-- /main-content -->

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="../js/issue/config.js"></script>
<script src="../js/roles.js"></script>
<script src="../js/header.js"></script>
<script src="../js/shared/gdb-utils.js"></script>
<script src="../js/issue/render.js"></script>
<script src="../js/issue/data.js"></script>
<script>
window.addEventListener('DOMContentLoaded', function() {
  document.addEventListener('click', function(ev) {
    var btn = ev.target.closest('[data-cgrp]');
    if (btn) toggleChartGroup(btn.getAttribute('data-cgrp'));
  });

  if (!localStorage.getItem('gdb_theme')) {
    document.documentElement.setAttribute('data-theme', 'dark');
    localStorage.setItem('gdb_theme', 'dark');
  }

  buildGdbHeader({ showRefresh: true });
  buildGdbIssueSubNav();
  gdbAuthGuard(function() {
    document.getElementById('main-content').style.display = 'block';
    initIssueBoard();
  });
});
</script>
</body>
</html>
