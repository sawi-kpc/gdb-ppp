<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Issues — List — GDB Dashboard</title>
<link rel="stylesheet" href="../css/shared.css">
<link rel="stylesheet" href="../css/gdb-shared.css">
<style>
.issue-content { padding: 20px 24px; max-width: 1600px; margin: 0 auto; min-width: 0; overflow: hidden; }
.panel-title { font-size: 14px; font-weight: 700; color: var(--text); }
.panel-sub   { font-size: 12px; color: var(--text2); margin-top: 2px; }

/* ── Control bar ── */
.ctrl-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.status-btn { padding: 4px 13px; font-size: 11px; font-weight: 600; border-radius: 20px; cursor: pointer; border: 1px solid var(--border); background: var(--surface2); color: var(--text2); transition: all .15s; }
.status-btn.active, .status-btn:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
.ctrl-sep { width: 1px; height: 20px; background: var(--border); margin: 0 2px; }
.ctrl-select:focus { border-color: var(--accent); }
.ctrl-search input { background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 5px 10px 5px 28px; font-size: 12px; width: 200px; outline: none; }
.ctrl-search input:focus { border-color: var(--accent); }
.ctrl-search { position: relative; }
.ctrl-search::before { content: '⌕'; position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--text3); font-size: 13px; pointer-events: none; }
.count-label { font-size: 11px; color: var(--text3); margin-left: auto; }
#btn-hide-archived{display:inline-flex;align-items:center;gap:6px;background:none;border:none;cursor:pointer;padding:0;flex-shrink:0}
.tog-track{position:relative;width:28px;height:16px;border-radius:8px;background:var(--border);transition:background .2s;flex-shrink:0}
.tog-thumb{position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--text3);transition:transform .2s,background .2s}
.tog-label{font-size:11.5px;font-weight:500;color:var(--text2);white-space:nowrap;transition:color .2s}
#btn-hide-archived.active .tog-track{background:var(--accent)}
#btn-hide-archived.active .tog-thumb{transform:translateX(12px);background:#fff}
#btn-hide-archived.active .tog-label{color:var(--accent);font-weight:600}

/* ── Pagination ── */
.pg-bar{display:flex;align-items:center;justify-content:flex-end;gap:4px;padding:7px 0}
.pg-btn { padding: 3px 9px; font-size: 11px; font-weight: 600; border-radius: 5px; cursor: pointer; border: 1px solid var(--border); background: var(--surface2); color: var(--text2); transition: all .15s; }
.pg-btn:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); color: #fff; }
.pg-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.pg-btn:disabled { opacity: .35; cursor: default; }

/* ── Status tags ── */
.stag { display: inline-flex; align-items: center; font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 4px; white-space: nowrap; }
.stag.open          { background: rgba(226,75,74,.12);  color: #A32D2D; border: 1px solid rgba(226,75,74,.2); }
.stag.investigating { background: rgba(239,159,39,.12); color: #854F0B; border: 1px solid rgba(239,159,39,.2); }
.stag.in-progress   { background: rgba(55,138,221,.12); color: #185FA5; border: 1px solid rgba(55,138,221,.2); }
.stag.resolved      { background: rgba(29,158,117,.12); color: #0F6E56; border: 1px solid rgba(29,158,117,.2); }
.stag.done          { background: rgba(63,185,80,.10);  color: #27500A; border: 1px solid rgba(63,185,80,.2); }

/* ── Severity badges ── */
.sev-badge { font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 4px; white-space: nowrap; flex-shrink: 0; }
.sev-badge.critical { background: rgba(226,75,74,.12); color: #A32D2D; border: 1px solid rgba(226,75,74,.2); }
.sev-badge.high     { background: rgba(249,115,22,.12); color: #7c3d12; border: 1px solid rgba(249,115,22,.2); }
.sev-badge.moderate { background: rgba(239,159,39,.12); color: #854F0B; border: 1px solid rgba(239,159,39,.2); }
.sev-badge.low      { background: rgba(63,185,80,.10);  color: #27500A; border: 1px solid rgba(63,185,80,.2); }
.comp-chip { font-size: 10px; padding: 2px 7px; border-radius: 3px; background: rgba(55,138,221,.1); color: #185FA5; border: 1px solid rgba(55,138,221,.2); white-space: nowrap; max-width: 120px; overflow: hidden; text-overflow: ellipsis; }
.comp-chips-wrap { display: flex; flex-wrap: wrap; gap: 4px; }

/* ── Table ── */
.itbl { width: 100%; border-collapse: collapse; font-size: 12px; }
.itbl th { text-align: left; padding: 8px 12px; border-bottom: 2px solid var(--border); font-size: 11px; font-weight: 700; color: var(--text2); white-space: nowrap; cursor: pointer; user-select: none; }
.itbl th:hover { color: var(--text); }
.itbl td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
.itbl tr:hover td { background: var(--surface2); }
.itbl .empty { text-align: center; padding: 40px; color: var(--text3); }
.tbl-warn { font-size: 10px; color: var(--down); font-weight: 600; margin-top: 2px; white-space: nowrap; }

/* ── Empty state ── */
.empty-state { text-align: center; padding: 60px 20px; color: var(--text3); font-size: 13px; }
</style>
</head>
<body class="has-init-subnav">
<div id="gdb-error"></div>

<div class="gdb-page" id="main-content" style="display:none">
<div class="issue-content">

  <!-- Issues panel -->
  <div class="panel">
    <div class="panel-head">
      <div>
        <div class="panel-title">◆ Issues &amp; Incidents</div>
        <div class="panel-sub">Live issue tracking across all platforms — synced from Jira</div>
      </div>
    </div>
    <div class="panel-body">

      <!-- Control bar -->
      <div class="ctrl-bar">
        <!-- Status dropdown -->
        <div style="position:relative" id="status-dropdown-wrap">
          <button id="status-dropdown-btn" onclick="toggleIssueDropdown('status-dropdown-panel')"
            style="height:28px;padding:0 10px;border:1px solid var(--border);border-radius:4px;background:var(--surface2);color:var(--text);font-size:11.5px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap">
            <span id="status-btn-label" data-empty="All Statuses">All Statuses</span>
            <span style="font-size:9px;color:var(--text3)">▾</span>
          </button>
          <div id="status-dropdown-panel" style="display:none;position:absolute;top:32px;left:0;z-index:200;background:var(--surface);border:1px solid var(--border);border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,0.18);padding:8px 0;min-width:170px">
            <div id="status-checkbox-list"></div>
            <div style="border-top:1px solid var(--border);margin-top:6px;padding:6px 12px 2px">
              <button onclick="clearIssueStatus()" style="font-size:10px;color:var(--text3);background:none;border:none;cursor:pointer;padding:0">Clear all</button>
            </div>
          </div>
        </div>
        <div class="ctrl-sep"></div>
        <!-- Priority dropdown -->
        <div style="position:relative" id="priority-dropdown-wrap">
          <button onclick="toggleIssueDropdown('priority-dropdown-panel')" style="height:28px;padding:0 10px;border:1px solid var(--border);border-radius:4px;background:var(--surface2);color:var(--text);font-size:11.5px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap">
            <span id="priority-btn-label" data-empty="All Priorities">All Priorities</span>
            <span style="font-size:9px;color:var(--text3)">▾</span>
          </button>
          <div id="priority-dropdown-panel" style="display:none;position:absolute;top:32px;left:0;z-index:200;background:var(--surface);border:1px solid var(--border);border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,0.18);padding:8px 0;min-width:160px">
            <div id="priority-checkbox-list"></div>
            <div style="border-top:1px solid var(--border);margin-top:6px;padding:6px 12px 2px">
              <button onclick="clearIssuePriority()" style="font-size:10px;color:var(--text3);background:none;border:none;cursor:pointer;padding:0">Clear all</button>
            </div>
          </div>
        </div>
        <!-- Severity dropdown -->
        <div style="position:relative" id="severity-dropdown-wrap">
          <button onclick="toggleIssueDropdown('severity-dropdown-panel')" style="height:28px;padding:0 10px;border:1px solid var(--border);border-radius:4px;background:var(--surface2);color:var(--text);font-size:11.5px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap">
            <span id="severity-btn-label" data-empty="All Severities">All Severities</span>
            <span style="font-size:9px;color:var(--text3)">▾</span>
          </button>
          <div id="severity-dropdown-panel" style="display:none;position:absolute;top:32px;left:0;z-index:200;background:var(--surface);border:1px solid var(--border);border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,0.18);padding:8px 0;min-width:160px">
            <div id="severity-checkbox-list"></div>
            <div style="border-top:1px solid var(--border);margin-top:6px;padding:6px 12px 2px">
              <button onclick="clearIssueSeverity()" style="font-size:10px;color:var(--text3);background:none;border:none;cursor:pointer;padding:0">Clear all</button>
            </div>
          </div>
        </div>
        <!-- Component dropdown -->
        <div style="position:relative" id="comp-dropdown-wrap">
          <button id="comp-dropdown-btn" onclick="toggleIssueDropdown('comp-dropdown-panel')"
            style="height:28px;padding:0 10px;border:1px solid var(--border);border-radius:4px;background:var(--surface2);color:var(--text);font-size:11.5px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap">
            <span id="comp-btn-label" data-empty="All Components">All Components</span>
            <span style="font-size:9px;color:var(--text3)">▾</span>
          </button>
          <div id="comp-dropdown-panel" style="display:none;position:absolute;top:32px;left:0;z-index:200;background:var(--surface);border:1px solid var(--border);border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,0.18);padding:8px 0;min-width:180px">
            <div id="comp-checkbox-list"></div>
            <div style="border-top:1px solid var(--border);margin-top:6px;padding:6px 12px 2px">
              <button onclick="clearIssueComp()" style="font-size:10px;color:var(--text3);background:none;border:none;cursor:pointer;padding:0">Clear all</button>
            </div>
          </div>
        </div>
        <!-- Group dropdown -->
        <div style="position:relative" id="group-dropdown-wrap">
          <button onclick="toggleIssueDropdown('group-dropdown-panel')" style="height:28px;padding:0 10px;border:1px solid var(--border);border-radius:4px;background:var(--surface2);color:var(--text);font-size:11.5px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap">
            <span id="group-btn-label" data-empty="All Groups">All Groups</span>
            <span style="font-size:9px;color:var(--text3)">▾</span>
          </button>
          <div id="group-dropdown-panel" style="display:none;position:absolute;top:32px;left:0;z-index:200;background:var(--surface);border:1px solid var(--border);border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,0.18);padding:8px 0;min-width:200px">
            <div id="group-checkbox-list"></div>
            <div style="border-top:1px solid var(--border);margin-top:6px;padding:6px 12px 2px">
              <button onclick="clearIssueGroup()" style="font-size:10px;color:var(--text3);background:none;border:none;cursor:pointer;padding:0">Clear all</button>
            </div>
          </div>
        </div>
        <!-- Assignee dropdown -->
        <div style="position:relative" id="issue-assignee-dropdown-wrap">
          <button onclick="toggleIssueDropdown('issue-assignee-dropdown-panel')" style="height:28px;padding:0 10px;border:1px solid var(--border);border-radius:4px;background:var(--surface2);color:var(--text);font-size:11.5px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap">
            <span id="issue-assignee-btn-label" data-empty="All Assignees">All Assignees</span>
            <span style="font-size:9px;color:var(--text3)">▾</span>
          </button>
          <div id="issue-assignee-dropdown-panel" style="display:none;position:absolute;top:32px;left:0;z-index:200;background:var(--surface);border:1px solid var(--border);border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,0.18);padding:8px 0;min-width:200px;white-space:nowrap">
            <div id="issue-assignee-checkbox-list"></div>
          </div>
        </div>
        <div style="flex:1"></div>
        <button id="btn-hide-archived" class="active" onclick="toggleHideArchived()">
          <span class="tog-track"><span class="tog-thumb"></span></span>
          <span class="tog-label">Hide Archived</span>
        </button>
        <div class="ctrl-search">
          <input type="text" id="issue-search" placeholder="Search…" oninput="applyFilters()">
        </div>
        <span class="count-label" id="count-label"></span>
      </div>

      <!-- Table view -->
      <div id="table-view-wrap">
        <div class="pg-bar" id="issue-pg-top"></div>
        <div class="tbl-scroll">
          <table class="itbl">
            <thead id="issue-list-thead"><tr>
              <th data-col="Key"      onclick="sortIssueBy('Key')" style="white-space:nowrap">Key</th>
              <th data-col="Summary"  onclick="sortIssueBy('Summary')">Summary</th>
              <th data-col="Status"   onclick="sortIssueBy('Status')">Status</th>
              <th data-col="Priority" onclick="sortIssueBy('Priority')" style="white-space:nowrap">Priority</th>
              <th data-col="Severity" onclick="sortIssueBy('Severity')" style="white-space:nowrap">Severity</th>
              <th data-col="Assignee" onclick="sortIssueBy('Assignee')">Assignee</th>
              <th data-col="Due"      onclick="sortIssueBy('Due')" style="white-space:nowrap">Due date</th>
            </tr></thead>
            <tbody id="issue-tbody"></tbody>
          </table>
        </div>
        <div class="pg-bar" id="issue-pg-bot"></div>
      </div>

    </div>
  </div><!-- /panel -->

</div><!-- /issue-content -->
</div><!-- /main-content -->

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="../js/issue/config.js"></script>
<script src="../js/header.js"></script>
<script src="../js/shared/gdb-utils.js"></script>
<script src="../js/issue/render.js"></script>
<script src="../js/issue/data.js"></script>
<script>
function toggleIssueDropdown(panelId) {
  var panel = document.getElementById(panelId); if (!panel) return;
  panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
}
document.addEventListener('click', function(e) {
  ['status-dropdown-wrap','comp-dropdown-wrap','issue-assignee-dropdown-wrap'].forEach(function(id) {
    var wrap = document.getElementById(id);
    if (wrap && !wrap.contains(e.target)) {
      var panel = wrap.querySelector('[id$="-panel"]');
      if (panel) panel.style.display = 'none';
    }
  });
});

window.addEventListener('DOMContentLoaded', function() {
  if (!localStorage.getItem('gdb_theme')) {
    document.documentElement.setAttribute('data-theme', 'dark');
    localStorage.setItem('gdb_theme', 'dark');
  }

  buildGdbHeader({ showRefresh: true });
  buildGdbIssueSubNav();
  gdbAuthGuard(function() {
    document.getElementById('main-content').style.display = 'block';
    _activeView = 'table';
    initIssueBoard();
  });
});
</script>
</body>
</html>
