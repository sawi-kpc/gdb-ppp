<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Initiatives Dashboard — GDB</title>
<link rel="stylesheet" href="../css/shared.css">
<link rel="stylesheet" href="../css/gdb-shared.css">
<link rel="stylesheet" href="../css/initiative.css">
<style>
.kpi-grid { grid-template-columns: repeat(7, 1fr); }
.dash-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
@media (max-width: 900px) {
  .kpi-grid { grid-template-columns: repeat(4, 1fr) !important; }
  .dash-cols { grid-template-columns: 1fr; }
}
</style>
</head>
<body class="has-init-subnav">

<div id="gdb-error"></div>
<div id="gdb-loading" class="gdb-loading-state"><div class="gdb-spinner-wrap"></div>Loading…</div>

<div id="init-content" class="gdb-page-content" style="display:none">
  <div class="filter-bar" style="margin-top:16px">
    <span class="fb-label">Roadmap year:</span>
    <div id="yf-init" style="display:flex;gap:6px;flex-wrap:wrap"></div>
    <div class="fb-sep"></div>
    <button class="fb-btn" id="btn-no-year" onclick="toggleNoYear(this)">No roadmap year</button>
  </div>

  <!-- KPI Strip -->
  <div class="kpi-grid" id="dash-kpi" style="margin-bottom:14px"></div>

  <!-- 2-column layout -->
  <div class="dash-cols">

    <!-- Left column -->
    <div>
      <div class="panel" id="dash-scatter"></div>
      <div class="panel" id="dash-conf-heatmap"></div>
      <div class="panel" id="dash-bau"></div>
      <div class="panel" id="dash-impact"></div>
      <div class="panel">
        <div class="panel-head">
          <div>
            <div class="panel-title">Action required</div>
            <div class="panel-sub">Items needing immediate attention</div>
          </div>
        </div>
        <div class="panel-body" id="init-alerts"></div>
      </div>
    </div>

    <!-- Right column -->
    <div>
      <div class="panel" id="dash-pipeline"></div>
      <div class="panel" id="dash-status-chart">
        <div class="panel-head"><div><div class="panel-title">By lifecycle status</div><div class="panel-sub">Count &amp; % of all items</div></div></div>
        <div class="panel-body" style="position:relative;height:220px"><canvas id="c-status"></canvas></div>
      </div>
      <div class="panel" id="dash-health"></div>
      <div class="panel" id="dash-assignee"></div>
    </div>

  </div>
</div>

<!-- Placeholder for data.js timestamp display -->
<span id="refresh-time" style="display:none"></span>
<span id="current-dt" style="display:none"></span>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="../js/initiative/config.js"></script>
<script src="../js/header.js"></script>
<script src="../js/shared/gdb-utils.js"></script>
<script src="../js/initiative/render.js"></script>
<script src="../js/initiative/data.js"></script>
<script>
/* Set callback BEFORE loadData() runs */
window.onDataReady = function(data) {
  document.getElementById('gdb-loading').style.display = 'none';
  document.getElementById('init-content').style.display = 'block';
  renderInitiatives();

  /* Update header time from data.js refresh-time span */
  var rtEl = document.getElementById('refresh-time');
  if (rtEl && typeof setGdbUpdateTime === 'function') {
    setGdbUpdateTime(new Date().toISOString());
  }
};

window.addEventListener('DOMContentLoaded', function() {
  buildGdbHeader({ showRefresh: true });
  buildGdbInitiativeSubNav();
  gdbAuthGuard(function(user) {
    /* loadData() is async and calls renderAll() + window.onDataReady() when done */
    loadData();
  });
  /* Wire refresh button to reload data */
  document.addEventListener('click', function(e) {
    if (e.target && e.target.id === 'gdb-refresh-btn') {
      document.getElementById('gdb-loading').style.display = 'flex';
      document.getElementById('init-content').style.display = 'none';
      loadData();
    }
  });
});
</script>
</body>
</html>
