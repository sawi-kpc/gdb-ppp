<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GDB Dashboard</title>
<link rel="stylesheet" href="css/shared.css">
<style>
body{padding-top:0;display:flex;align-items:flex-start;justify-content:center;min-height:100vh;padding-top:12vh;}
.auth-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:56px;max-width:760px;width:90vw;text-align:center;}
.auth-logo{font-size:28px;font-weight:800;color:var(--text);letter-spacing:-.02em;margin-bottom:4px;}
.auth-sub{font-size:13px;color:var(--text3);margin-bottom:32px;}
.auth-checking{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--text3);font-size:13px;margin-top:8px;}
.auth-spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0;}
@keyframes spin{to{transform:rotate(360deg)}}
.access-denied{text-align:center;padding:8px 0 0;}
.access-denied-icon{font-size:48px;margin-bottom:20px;}
.access-denied-title{font-size:22px;font-weight:700;color:var(--text);margin-bottom:10px;}
.access-denied-msg{font-size:14px;color:var(--text2);line-height:1.7;margin-bottom:24px;}
.access-denied-msg a{color:var(--accent);font-weight:600;text-decoration:none;}.access-denied-msg a:hover{text-decoration:underline;}
.signin-btn{display:inline-block;margin-top:16px;padding:10px 28px;font-size:14px;font-weight:600;background:var(--accent);color:#fff;border-radius:6px;text-decoration:none;cursor:pointer;letter-spacing:.01em;}.signin-btn:hover{opacity:.85;}
</style>
<script>
(function(){
  var theme = localStorage.getItem('gdb_theme') || 'dark';
  document.documentElement.setAttribute('data-theme', theme);
  /* maintenance check runs at runtime via JS below */
})();
</script>
</head>
<body class="auth-page">
<div class="auth-card" id="auth-card">
  <div class="auth-logo">GDB</div>
  <div class="auth-sub">Product and Project Portfolio Dashboard</div>
  <div class="auth-checking" id="auth-checking">
    <div class="auth-spinner"></div>
    Verifying access…
  </div>
</div>

<script>
var GDB_PROJECT_ID = 'gdb-dashboard-prod';
var GDB_API_KEY    = 'AIzaSyCaS5kLNbm5lSLRHd1rdr0sXRCS5lB_Rgc';

function _docId(email) {
  return email.toLowerCase().replace(/[^a-z0-9]/g, '_');
}

function _showDenied(email) {
  document.getElementById('auth-checking').style.display = 'none';
  var card = document.getElementById('auth-card');
  var denied = document.createElement('div');
  denied.className = 'access-denied';
  denied.innerHTML =
    '<div class="access-denied-icon">🔒</div>' +
    '<div class="access-denied-title">Access Not Granted</div>' +
    '<div class="access-denied-msg">' +
      'Your account (<strong>' + email + '</strong>) does not have permission to access this dashboard.<br>' +
      'To get access, please contact <a href="mailto:kpcproduct@kingpower.com">kpcproduct@kingpower.com</a>.' +
    '</div>' +
    '';
  card.appendChild(denied);
}

function _checkRoles(email) {
  var url = 'https://firestore.googleapis.com/v1/projects/' + GDB_PROJECT_ID +
            '/databases/(default)/documents/team_members/' + _docId(email) +
            '?key=' + GDB_API_KEY;
  fetch(url)
    .then(function(r) { return r.ok ? r.json() : null; })
    .then(function(doc) {
      var hasRole = false;
      if (doc && doc.fields) {
        var activeField = doc.fields.active;
        var isActive = !activeField || activeField.booleanValue !== false;
        if (isActive) {
          var rf = doc.fields.roles;
          if (rf && rf.arrayValue && rf.arrayValue.values && rf.arrayValue.values.length > 0) {
            hasRole = true;
          }
        }
      }
      if (hasRole) {
        window.location.replace('/initiative/');
      } else {
        _showDenied(email);
      }
    })
    .catch(function() { _showDenied(email); });
}

function _showSignIn(title, msg) {
  document.getElementById('auth-checking').style.display = 'none';
  var card = document.getElementById('auth-card');
  var extra = msg ? '<div class="access-denied-msg">' + msg + '</div>' : '';
  card.innerHTML +=
    '<div class="access-denied">' +
    '<div class="access-denied-icon">🔒</div>' +
    '<div class="access-denied-title">' + title + '</div>' +
    extra +
    '<a class="signin-btn" href="/initiative/">Sign in</a>' +
    '</div>';
}

function _startAuth() {
  var _signedOut = false;
  try { _signedOut = localStorage.getItem('gdb_signed_out') === '1'; } catch(e) {}
  if (_signedOut) {
    try { localStorage.removeItem('gdb_signed_out'); } catch(e) {}
    _showSignIn('You have signed out');
  } else {
    fetch('/cdn-cgi/access/get-identity', { credentials: 'same-origin' })
      .then(function(r) { return r.ok ? r.json() : null; })
      .then(function(identity) {
        if (identity && identity.email) {
          _checkRoles(identity.email);
        } else {
          _showSignIn('Permission Required',
            'To get access, please contact <a href="mailto:kpcproduct@kingpower.com">kpcproduct@kingpower.com</a>.');
        }
      })
      .catch(function() {
        document.getElementById('auth-checking').style.display = 'none';
      });
  }
}

fetch('https://firestore.googleapis.com/v1/projects/' + GDB_PROJECT_ID + '/databases/(default)/documents/gdb-ppp_config/app?key=' + GDB_API_KEY)
  .then(function(r) { return r.ok ? r.json() : null; })
  .then(function(doc) {
    if (doc && doc.fields && doc.fields.maintenance && doc.fields.maintenance.booleanValue === true) {
      window.location.replace('/maintenance/');
    } else {
      _startAuth();
    }
  })
  .catch(function() { _startAuth(); });
</script>
</body>
</html>
